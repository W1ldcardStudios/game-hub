<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Hub v4.0</title>
<style>
:root{color-scheme:dark;--bg:#080e1a;--panel:#152238;--line:#344865;--muted:#a9b9d0;--blue:#579dff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:white;font-family:system-ui,Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
.layout{display:flex;min-height:100vh}
aside{width:210px;background:#101b2c;border-right:1px solid var(--line);padding:18px 12px;flex-shrink:0}
.logo{font-size:25px;font-weight:900;margin:12px 8px 25px}
.logo span{color:var(--blue)}
.nav{display:block;width:100%;border:0;background:transparent;color:var(--muted);padding:13px;text-align:left;border-radius:10px;margin:5px 0}
.nav:hover,.nav.active{background:#294569;color:white}
main{flex:1;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;padding:17px 25px;background:#101b2c;border-bottom:1px solid var(--line)}
#content{max-width:1350px;margin:auto;padding:24px}
h1{margin:0 0 12px}h2{margin:0 0 12px}h3{margin:0 0 8px}
p{line-height:1.5}
.muted{color:var(--muted)}
.btn{border:0;background:#347edb;color:white;padding:11px 16px;border-radius:9px;font-weight:700;margin:3px}
.btn:hover:not(:disabled){background:#589cf1}
.btn.secondary{background:#304660}
.btn.danger{background:#a64054}
.field{width:100%;padding:11px;background:#0c1829;border:1px solid #4c6281;border-radius:9px;color:white;margin:8px 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:21px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden}
.cardbody{padding:17px}
.art{height:165px;display:grid;place-items:center;font-size:70px;background:linear-gradient(120deg,#314e7b,#152238)}
.art img{width:100%;height:100%;object-fit:cover}
.feature{position:relative;min-height:340px;border-radius:17px;overflow:hidden;background:#203958;margin:20px 0}
.feature>img{position:absolute;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#080e1af5,#080e1acc,#080e1a10)}
.featureinfo{position:relative;max-width:540px;padding:42px 32px}
.featureinfo h2{font-size:42px}
.controls{position:absolute;right:15px;bottom:15px;display:flex;gap:7px}
.controls button{border:1px solid #ffffff66;border-radius:50%;width:43px;height:43px;background:#10223edc;color:white;font-size:20px}
.hero{height:300px;background:#233a5a;border-radius:15px;overflow:hidden;display:grid;place-items:center;font-size:90px}
.hero img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.balance{background:#263e60;padding:10px 13px;border-radius:10px;color:#ffdc88;font-weight:800}
.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;overflow:hidden;background:#365b91;color:white;font-size:25px;font-weight:900;text-align:center;overflow-wrap:anywhere;flex-shrink:0}
.avatar.big{width:105px;height:105px;font-size:34px;border:4px solid #ffffff88}
.avatar img{width:100%;height:100%;object-fit:cover}
.banner{min-height:225px;border-radius:16px;padding:23px;display:flex;align-items:flex-end;gap:17px;background-size:cover;background-position:center;border:1px solid #ffffff44}
.banner h2,.banner p{text-shadow:0 2px 8px #000b}
.editorgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.editorbox{background:#0d1a2e;border:1px solid var(--line);padding:18px;border-radius:14px}
.previewavatar{width:125px;height:125px;border-radius:50%;margin:15px auto;display:grid;place-items:center;overflow:hidden;font-size:36px;font-weight:900;overflow-wrap:anywhere;text-align:center}
.previewbanner{height:145px;border-radius:12px;margin:15px 0;background-size:cover;background-position:center}
.modes{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.modes button.active{outline:2px solid #9acbff}
.colorrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:9px 0}
.colorrow input[type=color]{width:55px;height:43px;border:0;background:transparent}
.colorrow input[type=text]{max-width:125px}
.sliderrow{display:flex;align-items:center;gap:12px;margin:12px 0}
.sliderrow input{flex:1;min-width:0}
.avatargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(55px,1fr));gap:8px}
.avatargrid button{font-size:27px;padding:10px;background:#2b4265;color:white;border:1px solid #53749c;border-radius:10px}
.userrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.notice{background:#263d5d;padding:14px;border-radius:10px;margin:12px 0}
.tabs{display:flex;gap:10px;margin:15px 0;flex-wrap:wrap}
.overlay{position:fixed;inset:0;z-index:20;background:#000c;display:grid;place-items:center;padding:15px}
.modal{background:var(--panel);border:1px solid #5a7395;border-radius:15px;padding:24px;width:min(470px,100%);max-height:95vh;overflow:auto}
.cropstage{width:100%;aspect-ratio:8/3;background:#070c15;touch-action:none;overflow:hidden;border-radius:10px;cursor:grab;margin:15px auto}
.cropstage.circle{max-width:320px;aspect-ratio:1/1;border-radius:50%}
.cropstage canvas{display:block;width:100%;height:100%}
.raritygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px}
.rarity{background:#263d5c;padding:16px;border-radius:11px;text-align:center}
.price{font-size:19px;font-weight:900;color:#ffd478}
footer{text-align:center;padding:25px;color:var(--muted)}
@media(max-width:760px){
 aside{width:64px;padding:10px 4px}.logo{font-size:11px;margin:12px 2px 20px}.logo span{display:none}
 .nav{font-size:0;text-align:center;padding:12px 0}.nav .emoji{font-size:22px}
 #content{padding:14px}.editorgrid{grid-template-columns:1fr}
 .featureinfo{padding:30px 20px}.featureinfo h2{font-size:30px}
}
#launchOverlay{position:fixed;inset:0;z-index:100;pointer-events:none;display:none;overflow:hidden;background:#06121b15}
#launchOverlay.active{display:block;animation:impactshake .6s ease-in 1.05s}
#launchBall{position:absolute;left:50%;top:50%;font-size:90px;transform:translate(-50%,-50%) scale(.05) rotate(-360deg);animation:balllaunch 1.2s cubic-bezier(.2,.05,.8,1) forwards;filter:drop-shadow(0 15px 10px #0008)}
#launchCrack{position:absolute;inset:0;opacity:0;background:repeating-conic-gradient(from 15deg at 50% 50%,transparent 0deg 13deg,#eafaffbb 13.15deg 13.35deg,transparent 13.5deg 27deg);clip-path:polygon(50% 50%,0 0,100% 0,100% 100%,0 100%);animation:glass 1.7s 1.07s forwards}
#launchText{position:absolute;top:12%;width:100%;text-align:center;font-size:clamp(36px,7vw,85px);font-weight:1000;color:#ffdd75;text-shadow:0 7px 15px #000;opacity:0;animation:showlaunch 2.2s 1.25s forwards}
@keyframes balllaunch{to{transform:translate(-50%,-50%) scale(14) rotate(60deg)}}
@keyframes impactshake{0%,100%{translate:0 0}30%{translate:13px -8px}55%{translate:-12px 7px}75%{translate:8px 3px}}
@keyframes glass{0%{opacity:0}15%{opacity:1}75%{opacity:.9}100%{opacity:0}}
@keyframes showlaunch{0%{opacity:0;transform:scale(.7)}25%,70%{opacity:1;transform:scale(1)}100%{opacity:0}}
.launchcount{font-size:clamp(25px,5vw,48px);font-weight:900;color:#ffd579;letter-spacing:.06em;font-variant-numeric:tabular-nums}
</style>
</head>

function nowTrusted(){return trustedTime===null?null:trustedTime+(performance.now()-trustedAt);}
async function syncLaunchClock(){
 try{
  const before=performance.now();
  const res=await fetch(location.href,{method:"HEAD",cache:"no-store"});
  const date=res.headers.get("date");
  if(!res.ok||!date)throw Error("No server date");
  const parsed=Date.parse(date);
  if(!Number.isFinite(parsed))throw Error("Invalid date");
  trustedTime=parsed+(performance.now()-before)/2;
  trustedAt=performance.now();
 }catch(e){console.warn("Launch clock could not sync",e);}
 updateLaunch();
}
function launchReady(){const n=nowTrusted();return n!==null&&n>=RELEASE_UTC;}
function launchCountdown(){
 const n=nowTrusted();
 if(n===null)return "Synchronising world clock...";
 const t=Math.max(0,Math.ceil((RELEASE_UTC-n)/1000));
 const h=String(Math.floor(t/3600)).padStart(2,"0");
 const m=String(Math.floor(t%3600/60)).padStart(2,"0");
 const sec=String(t%60).padStart(2,"0");
 return `${h}:${m}:${sec}`;
}

const avatars=[
  ["classic","🎮"],["cat","🐈"],["robot","🤖"],["star","⭐"],

  ["star","Star Player","⭐",true],["robot","Robot","🤖",true],
  ["cat","Cat","🐈",true],["galaxy","Galaxy","🌌",false],
  ["royal","Royal","👑",false],["diamond","Diamond","💎",false],
  ["developer","Developer","🛠️",false]
];

let user=null,profile=null,isAdmin=false,page="discover";
let selectedGame=games[0],selectedPlayer=null;
let featuredIndex=0,carouselTimer=null,selectedGarage="boost";
let authMode="login";

function el(tag,cls="",value=""){
  const x=document.createElement(tag);
  x.className=cls;x.textContent=value;return x;
}
function txt(parent,tag,value,cls=""){
  const x=el(tag,cls,value);parent.append(x);return x;
}
function button(label,fn,cls="btn"){
  const x=el("button",cls,label);x.type="button";x.onclick=fn;return x;

function error(e){console.error(e);return e?.message||"Something went wrong.";}
function validName(s){return /^[A-Za-z0-9_]{3,20}$/.test(s);}
function validHex(s){return /^#[0-9a-fA-F]{6}$/.test(s);}
function safeColor(s){return validHex(s)?s:"#ffffff";}
function art(parent,path,emoji){

  const img=new Image();img.alt="Game artwork";
  img.src=encodeURI(path);
  img.onerror=()=>{img.remove();parent.textContent=emoji;};
  parent.append(img);
}

  if(!profile){page="setup";render();return false;}

}

  if(["profile","friends","inventory","garage","admin"].includes(next)&&!requireUser())return;
  if(next==="admin"&&!isAdmin)next="discover";
  page=next;render();window.scrollTo(0,0);
}
function render(){
  content.replaceChildren();
  document.querySelectorAll(".nav").forEach(n=>
    n.classList.toggle("active",n.dataset.page===page));
  const routes={
    discover,detail,shop:shopPage,garage:garagePage,

  };

// ====================================================
// PROFILE APPEARANCE
// ====================================================

const baseBg=()=>({
  mode:"solid",
  colors:["#345d9d","#8e4bd1","#ff6894"],
  angle:120
});
const baseAppearance=()=>({
  avatarMode:"preset",
  avatarText:"GH",
  avatarBg:baseBg(),
  bannerMode:"color",
  bannerBg:{
    mode:"gradient2",
    colors:["#17263e","#345d9d","#a64bc4"],
    angle:120
  },
  usernameColor:"#ffffff",
  bioColor:"#e4eaf5",
  avatarVersion:0,
  bannerVersion:0
});

function normalizeBg(input,fallback){
  const bg={...fallback,...(input||{})};
  if(!["solid","gradient2","gradient3"].includes(bg.mode))bg.mode="solid";
  bg.colors=[0,1,2].map(i=>safeColor(bg.colors?.[i]||fallback.colors[i]));
  bg.angle=Math.max(0,Math.min(360,Number(bg.angle)||0));
  return bg;
}
function appearanceFor(p){
  const base=baseAppearance();
  const raw=p?.appearance||{};
  return {
    ...base,
    avatarMode:["preset","text","photo"].includes(raw.avatarMode)?raw.avatarMode:"preset",
    avatarText:String(raw.avatarText||"GH").slice(0,6),
    avatarBg:normalizeBg(raw.avatarBg,base.avatarBg),
    bannerMode:raw.bannerMode==="photo"?"photo":"color",
    bannerBg:normalizeBg(raw.bannerBg,base.bannerBg),
    usernameColor:safeColor(raw.usernameColor),
    bioColor:safeColor(raw.bioColor),
    avatarVersion:Number(raw.avatarVersion)||0,
    bannerVersion:Number(raw.bannerVersion)||0
  };
}
function bgCSS(bg){
  const c=bg.colors.map(safeColor);
  if(bg.mode==="gradient2")
    return `linear-gradient(${bg.angle}deg,${c[0]},${c[1]})`;
  if(bg.mode==="gradient3")
    return `linear-gradient(${bg.angle}deg,${c[0]},${c[1]},${c[2]})`;
  return c[0];
}

function imageURL(uid, type, version = 0) {
  if (!uid) return "";

  const params = new URLSearchParams({
    uid,
    type,
    v: String(version)
  });

  return `${WORKER_URL}?${params.toString()}`;
}

async function uploadImage(blob, type) {
  if (!user) {
    throw new Error("You must sign in first.");
  }

  if (!["avatar", "banner"].includes(type)) {
    throw new Error("Invalid image type.");
  }

  const token = await user.getIdToken();

  const response = await fetch(
    `${WORKER_URL}?type=${encodeURIComponent(type)}`,
    {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${token}`,
        "Content-Type": "image/jpeg"
      },
      body: blob
    }
  );

  if (!response.ok) {
    throw new Error(await response.text());
  }

  return await response.json();
}
function paint(node,background){
  node.style.background=background;
}
function avatarElement(p,big=false,local=null){
  const a=local||appearanceFor(p);
  const x=el("div","avatar"+(big?" big":""));
  if(a.avatarMode==="photo"&&p?.uid&&WORKER_URL){
    const img=new Image();
    img.alt="Profile picture";
    img.src=imageURL(p.uid,"avatar",a.avatarVersion);
    img.onerror=()=>{
      img.remove();
      x.textContent="📷";
    };
    x.append(img);
  }else if(a.avatarMode==="text"){
    paint(x,bgCSS(a.avatarBg));
    x.textContent=a.avatarText||"GH";
    x.style.fontSize=big?"27px":"15px";
  }else{
    x.textContent=avatars.find(v=>v[0]===p?.avatar)?.[1]||"🎮";
  }
  return x;
}
function paintBanner(node,p,a){
  if(a.bannerMode==="photo"&&p?.uid&&WORKER_URL){
    node.style.background=`center / cover url("${imageURL(p.uid,"banner",a.bannerVersion)}")`;
  }else{
    paint(node,bgCSS(a.bannerBg));
  }

onAuthStateChanged(auth,async current=>{
  user=current;profile=null;isAdmin=false;
  if(current){
    try{
      const [snap,token]=await Promise.all([
        getDoc(doc(db,"users",current.uid)),
        current.getIdTokenResult()
      ]);
      if(auth.currentUser?.uid!==current.uid)return;
      profile=snap.exists()?{uid:current.uid,...snap.data()}:null;

    }catch(e){console.error(e);}
  }
  $("headerName").textContent=profile?.username||current?.email||"Guest";
  $("authButton").hidden=!!current;
  $("logoutButton").hidden=!current;
  $("adminNav").hidden=!isAdmin;

});

// ====================================================
// PHOTO CROPPER — DRAG + ZOOM
// ====================================================

let cropImage=null,cropType="avatar",cropCallback=null;
let zoom=1,offsetX=0,offsetY=0,dragging=false,lastX=0,lastY=0;
const canvas=$("cropCanvas"),ctx=canvas.getContext("2d");
const stage=$("cropStage");

function dimensions(){
  return cropType==="avatar"?[400,400]:[1200,450];
}
function drawCrop(){
  if(!cropImage)return;
  const [w,h]=dimensions();
  canvas.width=w;canvas.height=h;
  const scale=Math.max(w/cropImage.width,h/cropImage.height)*zoom;
  const dw=cropImage.width*scale,dh=cropImage.height*scale;
  offsetX=Math.max(-(dw-w)/2,Math.min((dw-w)/2,offsetX));
  offsetY=Math.max(-(dh-h)/2,Math.min((dh-h)/2,offsetY));
  ctx.clearRect(0,0,w,h);
  ctx.drawImage(cropImage,(w-dw)/2+offsetX,(h-dh)/2+offsetY,dw,dh);
}
function openCrop(file,type,callback){
  if(!file)return;
  if(!file.type.startsWith("image/")||file.size>15*1024*1024){
    alert("Choose an image under 15 MB.");return;
  }
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      cropImage=img;cropType=type;cropCallback=callback;
      zoom=1;offsetX=0;offsetY=0;
      $("cropZoom").value=1;$("cropZoomLabel").textContent="1.00×";
      $("cropTitle").textContent=type==="avatar"?"Crop Profile Picture":"Crop Banner";
      stage.classList.toggle("circle",type==="avatar");
      $("cropOverlay").hidden=false;drawCrop();
    };
    img.onerror=()=>alert("Couldn't open this image.");
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}
$("cropZoom").oninput=e=>{
  zoom=Number(e.target.value);
  $("cropZoomLabel").textContent=zoom.toFixed(2)+"×";
  drawCrop();
};
stage.addEventListener("pointerdown",e=>{
  if(!cropImage)return;
  dragging=true;lastX=e.clientX;lastY=e.clientY;
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener("pointermove",e=>{
  if(!dragging)return;
  const rect=stage.getBoundingClientRect();
  const [w,h]=dimensions();
  offsetX+=(e.clientX-lastX)*w/rect.width;
  offsetY+=(e.clientY-lastY)*h/rect.height;
  lastX=e.clientX;lastY=e.clientY;drawCrop();
});
stage.addEventListener("pointerup",()=>dragging=false);
stage.addEventListener("pointercancel",()=>dragging=false);
$("cropCancel").onclick=()=>{
  $("cropOverlay").hidden=true;cropImage=null;
};
$("cropSave").onclick=()=>{
  if(!cropImage)return;
  drawCrop();
  const output=document.createElement("canvas");
  const [w,h]=dimensions();output.width=w;output.height=h;
  output.getContext("2d").drawImage(canvas,0,0);
  output.toBlob(blob=>{
    if(blob)cropCallback(blob);
    $("cropOverlay").hidden=true;cropImage=null;
  },"image/jpeg",.82);
};

function colorControl(parent,label,initial,change){
  const row=el("div","colorrow");
  txt(row,"strong",label);
  const picker=el("input");picker.type="color";
  picker.value=safeColor(initial);
  const hex=field("#RRGGBB",picker.value);
  hex.maxLength=7;hex.style.width="125px";
  picker.oninput=()=>{hex.value=picker.value;change(picker.value);};
  hex.onchange=()=>{
    if(validHex(hex.value)){
      picker.value=hex.value;change(hex.value);
    }else hex.value=picker.value;
  };
  row.append(picker,hex);parent.append(row);
}
function backgroundEditor(parent,bg,change){
  const modes=el("div","modes");
  const settings=el("div");
  parent.append(modes,settings);
  function redraw(){
    modes.replaceChildren();settings.replaceChildren();
    for(const [id,label] of [
      ["solid","Solid"],["gradient2","2-Colour Gradient"],
      ["gradient3","3-Colour Gradient"]
    ]){
      const b=button(label,()=>{
        bg.mode=id;change();redraw();
      },"btn secondary"+(bg.mode===id?" active":""));
      modes.append(b);
    }
    const count=bg.mode==="solid"?1:bg.mode==="gradient2"?2:3;
    for(let i=0;i<count;i++){
      colorControl(settings,`Colour ${i+1}`,bg.colors[i],value=>{
        bg.colors[i]=value;change();
      });
    }
    if(count>1){
      const row=el("div","sliderrow");
      txt(row,"strong","Angle");
      const slider=el("input");slider.type="range";
      slider.min=0;slider.max=360;slider.value=bg.angle;
      const value=txt(row,"span",`${bg.angle}°`);
      slider.oninput=()=>{
        bg.angle=Number(slider.value);
        value.textContent=`${bg.angle}°`;change();
      };
      row.insertBefore(slider,value);settings.append(row);
    }
  }
  redraw();
}

function profilePage(){
  if(!requireUser())return;

    previewHolder.replaceChildren();

      const avatar=p.querySelector(".avatar");
      avatar.replaceChildren();

  left.append(avatarPreview);
  const avatarModes=el("div","modes");
  const avatarOptions=el("div");
  left.append(avatarModes,avatarOptions);

  function drawAvatar(){
    avatarModes.replaceChildren();avatarOptions.replaceChildren();
    avatarPreview.replaceChildren();
    for(const [id,label] of [
      ["preset","Emoji"],["text","Custom Text"],["photo","Photo"]
    ]){
      avatarModes.append(button(label,()=>{
        a.avatarMode=id;drawAvatar();refresh();
      },"btn secondary"+(a.avatarMode===id?" active":"")));
    }

      avatarPreview.textContent=avatars.find(x=>x[0]===profile.avatar)?.[1]||"🎮";
      const grid=el("div","avatargrid");
      for(const [id,emoji] of avatars){
        grid.append(button(emoji,()=>{
          profile.avatar=id;
          avatarPreview.textContent=emoji;
          refresh();
        }));

      avatarOptions.append(grid);
    }else if(a.avatarMode==="text"){
      paint(avatarPreview,bgCSS(a.avatarBg));
      avatarPreview.textContent=a.avatarText;
      const input=field("Avatar letters or word",a.avatarText);
      input.maxLength=6;

        a.avatarText=input.value;

      };

      backgroundEditor(avatarOptions,a.avatarBg,()=>{
        paint(avatarPreview,bgCSS(a.avatarBg));refresh();
      });
    }else{

        imageURL(user.uid,"avatar",a.avatarVersion);

        img.style.cssText="width:100%;height:100%;object-fit:cover";
        avatarPreview.append(img);
      }else avatarPreview.textContent="📷";
      const upload=el("input","field");
      upload.type="file";upload.accept="image/*";
      upload.onchange=()=>{
        openCrop(upload.files[0],"avatar",blob=>{
          if(avatarPreviewURL)URL.revokeObjectURL(avatarPreviewURL);
          pending.avatar=blob;
          avatarPreviewURL=URL.createObjectURL(blob);
          drawAvatar();refresh();
        });
        upload.value="";
      };
      avatarOptions.append(upload);
    }

      upload.onchange=()=>{
        openCrop(upload.files[0],"banner",blob=>{
          if(bannerPreviewURL)URL.revokeObjectURL(bannerPreviewURL);
          pending.banner=blob;
          bannerPreviewURL=URL.createObjectURL(blob);
          drawBanner();refresh();

        if(!WORKER_URL)throw Error("Set up Cloudflare before saving uploaded photos.");
        await uploadImage(pending.avatar,"avatar");
        a.avatarVersion=Date.now();

        a.bannerVersion=Date.now();
      }
      if((a.avatarMode==="photo"&&!WORKER_URL)||
         (a.bannerMode==="photo"&&!WORKER_URL))
        throw Error("Photo mode needs the Cloudflare Worker.");
      await saveProfile({
        avatar:profile.avatar,
        appearance:a
      });
      notice("Profile appearance saved!");

    finally{save.disabled=false;}

  savePanel.append(save);

  const bioPanel=panel("Edit Bio");

  bio.rows=4;bio.maxLength=500;bio.value=profile.bio||"";

  }));
}

    const uid=user.uid;
    const [r,s]=await Promise.all([
      getDocs(query(collection(db,"friendRequests"),where("receiver","==",uid))),
      getDocs(query(collection(db,"friendRequests"),where("sender","==",uid)))
    ]);
    if(page!=="friends")return;
    const requests=new Map();
    [...r.docs,...s.docs].forEach(d=>requests.set(d.id,{id:d.id,...d.data()}));
    let counts=[0,0,0];
    for(const req of requests.values()){
      const other=req.sender===uid?req.receiver:req.sender;
      const snap=await getDoc(doc(db,"users",other));
      const p=snap.exists()?{uid:other,...snap.data()}:{uid:other,username:"Unknown"};
      if(page!=="friends")return;
      if(req.status==="accepted"){
        counts[2]++;
        playerRow(accepted,p,[{label:"View",fn:()=>{
          selectedPlayer=p;go("publicProfile");
        }}]);
      }else if(req.receiver===uid){
        counts[0]++;
        playerRow(incoming,p,[
          {label:"Accept",fn:async()=>{
            try{await updateDoc(doc(db,"friendRequests",req.id),{status:"accepted"});go("friends");}
            catch(e){notice(error(e));}
          }},
          {label:"Decline",fn:async()=>{
            try{await deleteDoc(doc(db,"friendRequests",req.id));go("friends");}
            catch(e){notice(error(e));}
          }}
        ]);
      }else{
        counts[1]++;
        playerRow(outgoing,p,[{label:"Cancel",fn:async()=>{
          try{await deleteDoc(doc(db,"friendRequests",req.id));go("friends");}
          catch(e){notice(error(e));}
        }}]);
      }
    }
    if(!counts[0])txt(incoming,"p","No incoming requests.","muted");
    if(!counts[1])txt(outgoing,"p","No pending requests.","muted");
    if(!counts[2])txt(accepted,"p","No friends yet.","muted");
  }catch(e){notice(error(e));}
}

// ====================================================
// EXISTING PROFILE SKIN INVENTORY
// ====================================================

async function inventoryPage(){
  if(!requireUser())return;
  txt(content,"h1","🎨 Profile Inventory");
  const grid=el("div","grid");content.append(grid);
  const owned=new Set(["classic"]);
  try{
    const snap=await getDocs(collection(db,"users",user.uid,"inventory"));
    snap.forEach(d=>owned.add(d.id));
  }catch(e){notice(error(e));}
  if(page!=="inventory")return;
  for(const [id,name,emoji,free] of skins){
    const has=owned.has(id);
    const card=el("div","panel");
    txt(card,"div",emoji,"art");txt(card,"h3",name);
    txt(card,"p",has?"Owned":free?"Free to claim":"Locked","muted");
    const b=button(profile.equipped===id?"Equipped":has?"Equip":free?"Claim Free":"Locked",async()=>{
      try{
        if(!has&&free)
          await setDoc(doc(db,"users",user.uid,"inventory",id),{skinId:id,source:"free"});
        else if(!has)return;
        await saveProfile({equipped:id});
        go("inventory");
      }catch(e){notice(error(e));}
    });
    b.disabled=profile.equipped===id||(!has&&!free);
    card.append(b);grid.append(card);
  }
}

// ====================================================
// NEWS + ADMIN
// ====================================================

async function newsPage(){
  txt(content,"h1","📢 News");
  const p=panel("Announcements");
  try{
    const snap=await getDocs(query(collection(db,"announcements"),orderBy("createdAt","desc"),limit(30)));
    if(page!=="news")return;
    if(snap.empty)txt(p,"p","No announcements yet.");
    snap.forEach(d=>{
      const n=el("div","notice");
      txt(n,"h3",d.data().title||"Announcement");
      txt(n,"p",d.data().body||"");p.append(n);
    });
  }catch(e){notice(error(e));}
}
function adminPage(){
  if(!isAdmin){go("discover");return;}
  txt(content,"h1","🛡️ Admin");
  const p=panel("Publish Announcement");
  const title=field("Title");
  title.maxLength=100;
  const body=el("textarea","field");
  body.rows=5;body.maxLength=1000;body.placeholder="Announcement";
  p.append(title,body);
  p.append(button("Publish",async()=>{
    if(!title.value.trim()||!body.value.trim())return;
    try{
      await addDoc(collection(db,"announcements"),{
        title:title.value.trim(),body:body.value.trim(),
        author:user.uid,createdAt:serverTimestamp()
      });
      title.value="";body.value="";notice("Published!");
    }catch(e){notice(error(e));}
  }));
}

render();
</script>
