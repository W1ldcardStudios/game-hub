
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameHub</title>

<style>
:root {
  --bg: #101116;
  --panel: #191b24;
  --panel2: #222530;
  --text: #f5f5f7;
  --muted: #a0a3b1;
  --accent: #7657ff;
  --accent2: #987fff;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

header {
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5%;
  background: #171820;
  border-bottom: 1px solid #292b36;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: -1px;
}

.logo span { color: var(--accent2); }

.header-right {
  display: flex;
  gap: 12px;
  align-items: center;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
  border: 0;
}

.header-btn {
  padding: 10px 15px;
  border-radius: 9px;
  color: white;
  background: var(--panel2);
}

.header-btn:hover { background: #343747; }

.hero {
  padding: 55px 5% 35px;
  background:
    radial-gradient(ellipse at 80% 20%, #44318b55, transparent 50%),
    linear-gradient(120deg, #1b1c2a, #111218);
}

.hero h1 {
  font-size: clamp(35px, 5vw, 58px);
  margin: 0 0 12px;
}

.hero h1 span { color: var(--accent2); }

.hero p {
  color: var(--muted);
  font-size: 16px;
}

.search {
  display: block;
  width: min(600px, 100%);
  padding: 15px 18px;
  margin-top: 25px;
  border-radius: 12px;
  border: 1px solid #383b4b;
  background: #20222d;
  color: white;
  outline: none;
}

.search:focus { border-color: var(--accent); }

main { padding: 30px 5%; }

.categories {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 30px;
}

.category {
  background: var(--panel);
  color: var(--muted);
  padding: 10px 16px;
  border-radius: 30px;
  border: 1px solid #30323e;
}

.category.active,
.category:hover {
  color: white;
  background: var(--accent);
  border-color: var(--accent);
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 25px 0 18px;
}

.section-title h2 {
  margin: 0;
  font-size: 23px;
}

.section-title small { color: var(--muted); }

.games {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 18px;
}

.game-card {
  background: var(--panel);
  border: 1px solid #292c37;
  border-radius: 14px;
  overflow: hidden;
  transition: transform .2s, border-color .2s;
  cursor: pointer;
  position: relative;
}

.game-card:hover {
  transform: translateY(-5px);
  border-color: var(--accent);
}

.game-art {
  height: 135px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 54px;
  background: linear-gradient(135deg, var(--c1), var(--c2));
}

.game-info { padding: 14px; }

.game-info h3 {
  margin: 0 0 7px;
  font-size: 17px;
}

.game-info p {
  margin: 0;
  color: var(--muted);
  font-size: 13px;
}

.game-tag {
  display: inline-block;
  margin-top: 12px;
  padding: 5px 9px;
  border-radius: 20px;
  background: #ffffff15;
  color: #ddd;
  font-size: 11px;
}

.favourite {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #111a;
  color: white;
  font-size: 19px;
}

.favourite.selected { color: #ffcf55; }

.empty {
  color: var(--muted);
  padding: 30px 0;
  display: none;
}

footer {
  padding: 35px 5%;
  color: var(--muted);
  border-top: 1px solid #292b36;
  margin-top: 50px;
}

/* Game player */

.player {
  position: fixed;
  inset: 0;
  background: #08090d;
  z-index: 20;
  display: none;
  flex-direction: column;
}

.player.open { display: flex; }

.player-bar {
  min-height: 65px;
  padding: 10px 18px;
  background: #191b24;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.player-bar h2 {
  font-size: 17px;
  margin: 0;
}

.player-actions {
  display: flex;
  gap: 8px;
}

.player-actions button {
  padding: 10px 13px;
  background: var(--panel2);
  color: white;
  border-radius: 8px;
}

#gameFrame {
  flex: 1;
  width: 100%;
  border: 0;
  background: #fff;
}

.player-message {
  display: none;
  color: white;
  text-align: center;
  padding: 25px;
}

@media(max-width: 550px) {
  header { padding: 0 4%; }
  main { padding: 25px 4%; }
  .hero { padding: 40px 4% 30px; }
  .games { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .game-art { height: 110px; }
  .player-bar { flex-wrap: wrap; }
}
</style>
</head>

<body>

<header>
  <div class="logo">GAME<span>HUB</span></div>
  <div class="header-right">
    <button class="header-btn" onclick="showFavourites()">★ Favourites</button>
    <button class="header-btn" onclick="showRecent()">Recently played</button>
  </div>
</header>

<section class="hero">
  <h1>PLAY MORE.<br><span>WORRY LESS.</span></h1>
  <p>Your games. Your library. Your GameHub.</p>
  <input
    class="search"
    id="search"
    placeholder="Search games..."
    oninput="renderGames()"
  >
</section>

<main>
  <div class="categories" id="categories"></div>

  <div class="section-title">
    <h2 id="sectionHeading">All games</h2>
    <small id="gameCount"></small>
  </div>

  <div class="games" id="games"></div>
  <div class="empty" id="empty">No games found. Try another search.</div>
</main>

<footer>
  <strong>GAMEHUB</strong>
  <p>Your personal browser gaming library.</p>
  <small>GameHub is an independent platform. Game names and trademarks belong to their respective owners.</small>
</footer>

<!-- Fullscreen game player -->
<div class="player" id="player">
  <div class="player-bar">
    <h2 id="playerTitle">Game</h2>
    <div class="player-actions">
      <button onclick="saveCurrentGame()">Save</button>
      <button onclick="reloadGame()">Restart</button>
      <button onclick="closeGame()">✕ Close</button>
    </div>
  </div>
  <iframe id="gameFrame" allowfullscreen></iframe>
  <div class="player-message" id="playerMessage"></div>
</div>

<script>
const gameList = [
  {
    id: "boostball",
    name: "Boostball",
    category: "Sports",
    icon: "⚽",
    description: "GameHub original",
    path: "/games/boostball/index.html",
    c1: "#174d8d",
    c2: "#35b8df"
  },
  {
    id: "counter-opps",
    name: "Counter Opps",
    category: "Action",
    icon: "🎯",
    description: "GameHub original",
    path: "/games/counter-opps/index.html",
    c1: "#343d4e",
    c2: "#9c4b50"
  },
  {
    id: "card-chaos",
    name: "Card Chaos",
    category: "Strategy",
    icon: "🃏",
    description: "GameHub original",
    path: "/games/card-chaos/index.html",
    c1: "#582a87",
    c2: "#dc5685"
  },
  {
    id: "doodle-sluggers",
    name: "Doodle Sluggers",
    category: "Sports",
    icon: "⚾",
    description: "GameHub original",
    path: "/games/doodle-sluggers/index.html",
    c1: "#26724b",
    c2: "#d6a64e"
  },
  {
    id: "life-simulator",
    name: "Life Simulator",
    category: "Simulation",
    icon: "🏡",
    description: "Our future life-simulation game",
    path: "/games/life-simulator/index.html",
    c1: "#3e5b8a",
    c2: "#59a58b"
  }
];

const categories = [
  "All", "Action", "Arcade", "Racing", "Sports",
  "Puzzle", "Strategy", "Simulation"
];

let activeCategory = "All";
let currentGame = null;
let specialView = null;

function getData(key, fallback = []) {
  try {
    return JSON.parse(localStorage.getItem("gamehub_" + key)) ?? fallback;
  } catch {
    return fallback;
  }
}

function setData(key, value) {
  localStorage.setItem("gamehub_" + key, JSON.stringify(value));
}

function renderCategories() {
  const container = document.getElementById("categories");

  container.innerHTML = categories.map(category => `
    <button
      class="category ${activeCategory === category ? "active" : ""}"
      onclick="selectCategory('${category}')"
    >${category}</button>
  `).join("");
}

function selectCategory(category) {
  activeCategory = category;
  specialView = null;
  document.getElementById("sectionHeading").textContent =
    category === "All" ? "All games" : category + " games";
  renderCategories();
  renderGames();
}

function renderGames() {
  const search = document.getElementById("search").value.toLowerCase();
  const favourites = getData("favourites");
  const recent = getData("recent");

  let list = [...gameList];

  if (specialView === "favourites") {
    list = list.filter(game => favourites.includes(game.id));
    document.getElementById("sectionHeading").textContent = "★ Favourites";
  } else if (specialView === "recent") {
    list = recent
      .map(id => gameList.find(game => game.id === id))
      .filter(Boolean);
    document.getElementById("sectionHeading").textContent = "Recently played";
  } else if (activeCategory !== "All") {
    list = list.filter(game => game.category === activeCategory);
  }

  list = list.filter(game =>
    game.name.toLowerCase().includes(search) ||
    game.category.toLowerCase().includes(search)
  );

  document.getElementById("gameCount").textContent =
    list.length + " games";

  document.getElementById("empty").style.display =
    list.length ? "none" : "block";

  document.getElementById("games").innerHTML = list.map(game => `
    <article class="game-card" onclick="launchGame('${game.id}')">
      <div class="game-art" style="--c1:${game.c1};--c2:${game.c2}">
        ${game.icon}
      </div>
      <button
        class="favourite ${favourites.includes(game.id) ? "selected" : ""}"
        onclick="event.stopPropagation();toggleFavourite('${game.id}')"
        aria-label="Toggle favourite"
      >★</button>
      <div class="game-info">
        <h3>${game.name}</h3>
        <p>${game.description}</p>
        <span class="game-tag">${game.category}</span>
      </div>
    </article>
  `).join("");
}

function toggleFavourite(id) {
  let favourites = getData("favourites");

  if (favourites.includes(id)) {
    favourites = favourites.filter(item => item !== id);
  } else {
    favourites.push(id);
  }

  setData("favourites", favourites);
  renderGames();
}

function showFavourites() {
  specialView = "favourites";
  activeCategory = "All";
  renderCategories();
  renderGames();
}

function showRecent() {
  specialView = "recent";
  activeCategory = "All";
  renderCategories();
  renderGames();
}

function launchGame(id) {
  const game = gameList.find(item => item.id === id);
  if (!game) return;

  currentGame = game;

  if (id === "life-simulator") {
    alert("Life Simulator is a planned GameHub original. We'll add its game files next!");
    return;
  }

  document.getElementById("playerTitle").textContent = game.name;
  document.getElementById("player").classList.add("open");
  document.getElementById("gameFrame").src = game.path;

  let recent = getData("recent");
  recent = [id, ...recent.filter(item => item !== id)].slice(0, 10);
  setData("recent", recent);
}

function closeGame() {
  document.getElementById("player").classList.remove("open");
  document.getElementById("gameFrame").src = "about:blank";
  currentGame = null;
}

function reloadGame() {
  const frame = document.getElementById("gameFrame");
  frame.src = frame.src;
}

function saveCurrentGame() {
  if (!currentGame) return;
  try {
    document.getElementById("gameFrame").contentWindow.postMessage({
      type: "GAMEHUB_SAVE_REQUEST",
      gameId: currentGame.id
    }, location.origin);
    alert("Save request sent to the game!");
  } catch (error) {
    alert("This game doesn't support GameHub saves yet.");
  }
}

// Shared API for games hosted on the same website.
// Inside a game iframe, use parent.GameHub.save() and parent.GameHub.load().
window.GameHub = {
  save(gameId, data) {
    setData("save_" + gameId, data);
  },

  load(gameId) {
    return getData("save_" + gameId, null);
  },

  getHighScore(gameId) {
    return getData("score_" + gameId, 0);
  },

  setHighScore(gameId, score) {
    const oldScore = getData("score_" + gameId, 0);
    if (score > oldScore) {
      setData("score_" + gameId, score);
    }
  }
};

renderCategories();
renderGames();
</script>

</body>
</html>
