
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Hub v3.7</title>

<style>
:root {
  --bg: #080d18;
  --nav: #101a2b;
  --panel: #152238;
  --line: #30425e;
  --text: #f5f8ff;
  --muted: #a5b7d0;
  --accent: #569dff;
  --green: #58dfaa;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, Arial, sans-serif;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

a {
  color: inherit;
  text-decoration: none;
}

[hidden] {
  display: none !important;
}

.layout {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  width: 215px;
  flex-shrink: 0;
  background: var(--nav);
  border-right: 1px solid var(--line);
  padding: 18px 12px;
}

.logo {
  font-size: 25px;
  font-weight: 900;
  margin: 12px 10px 30px;
}

.logo span {
  color: var(--accent);
}

.nav {
  display: block;
  width: 100%;
  background: transparent;
  border: 0;
  border-radius: 10px;
  padding: 13px;
  margin: 5px 0;
  color: var(--muted);
  text-align: left;
}

.nav:hover,
.nav.active {
  background: #263d5e;
  color: white;
}

.main {
  flex: 1;
  min-width: 0;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  padding: 17px 25px;
  background: var(--nav);
  border-bottom: 1px solid var(--line);
}

.content {
  padding: 26px;
  max-width: 1450px;
  margin: auto;
}

h1 {
  margin: 0 0 12px;
  font-size: 32px;
}

h2 {
  margin: 0 0 14px;
}

h3 {
  margin: 0 0 8px;
}

p {
  line-height: 1.5;
}

.muted {
  color: var(--muted);
}

.small {
  font-size: 13px;
}

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.btn {
  display: inline-block;
  background: #347edb;
  color: white;
  border: 0;
  border-radius: 9px;
  padding: 11px 17px;
  font-weight: 700;
  margin: 3px;
}

.btn:hover {
  background: #579af0;
}

.btn.secondary {
  background: #2a405d;
}

.btn.danger {
  background: #a53c50;
}

.field {
  display: block;
  width: 100%;
  background: #0b1729;
  color: white;
  border: 1px solid #425a7b;
  border-radius: 9px;
  padding: 12px;
  margin: 10px 0;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 22px;
  margin: 18px 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
  gap: 18px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 15px;
  overflow: hidden;
  transition: .2s;
}

.card:hover {
  transform: translateY(-4px);
  border-color: var(--accent);
}

.art {
  height: 175px;
  background: linear-gradient(135deg, #334d74, #16253c);
  display: grid;
  place-items: center;
  font-size: 70px;
  overflow: hidden;
}

.art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.cardbody {
  padding: 16px;
}

.feature {
  position: relative;
  min-height: 350px;
  background: #263b59;
  border-radius: 18px;
  overflow: hidden;
  margin: 22px 0;
}

.feature > img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.shade {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    90deg,
    #080d18f5,
    #080d18bd,
    #080d1820
  );
}

.featureinfo {
  position: relative;
  padding: 48px 35px;
  max-width: 570px;
}

.featureinfo h2 {
  font-size: 45px;
}

.tag {
  display: inline-block;
  background: #284a76;
  border-radius: 30px;
  padding: 5px 11px;
  font-size: 12px;
  font-weight: 800;
}

.hero {
  height: 350px;
  background: #253b5b;
  border-radius: 16px;
  overflow: hidden;
  display: grid;
  place-items: center;
  font-size: 100px;
  margin: 20px 0;
}

.hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.userrow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}

.avatar {
  height: 50px;
  width: 50px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #304c70;
  display: grid;
  place-items: center;
  font-size: 26px;
  overflow: hidden;
  object-fit: cover;
}

.avatar.big {
  height: 105px;
  width: 105px;
  font-size: 55px;
}

.profile-banner {
  padding: 30px;
  border-radius: 16px;
  margin-bottom: 20px;
  border: 1px solid #ffffff30;
}

.profile-banner h2,
.profile-banner p {
  color: white;
  text-shadow: 0 1px 4px #0009;
}

.profile-banner .avatar {
  border: 3px solid white;
}

.avatar-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
  gap: 12px;
  margin: 18px 0;
}

.avatar-choice {
  font-size: 36px;
  padding: 12px;
  border: 2px solid transparent;
  background: #263d5e;
  border-radius: 12px;
}

.avatar-choice:hover {
  border-color: var(--accent);
}

.color-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 16px 0;
}

.color-choice {
  width: 48px;
  height: 48px;
  border: 3px solid #ffffff55;
  border-radius: 12px;
}

.color-choice:hover {
  border-color: white;
}

.color-picker {
  width: 100px;
  height: 50px;
  padding: 4px;
  background: #1a2941;
  border: 1px solid #536d92;
  border-radius: 10px;
  cursor: pointer;
}

.skin {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 17px;
}

.skin.selected {
  border-color: var(--green);
}

.skinart {
  height: 100px;
  background: #243954;
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-size: 60px;
  margin-bottom: 12px;
}

.notice {
  background: #233a56;
  border-radius: 10px;
  padding: 15px;
  margin: 12px 0;
}

.status {
  background: #243c58;
  border: 1px solid #4b739d;
  padding: 13px;
  border-radius: 10px;
  margin: 15px 0;
}

.overlay {
  position: fixed;
  inset: 0;
  background: #000c;
  z-index: 20;
  display: grid;
  place-items: center;
  padding: 16px;
}

.modal {
  background: var(--panel);
  border: 1px solid #536d92;
  border-radius: 16px;
  padding: 25px;
  width: min(450px, 100%);
  max-height: 90vh;
  overflow: auto;
}

.tabs {
  display: flex;
  gap: 10px;
  margin: 16px 0;
}

.tabs button {
  flex: 1;
}

footer {
  text-align: center;
  color: var(--muted);
  padding: 25px;
}

@media(max-width:760px) {
  .sidebar {
    width: 65px;
    padding: 10px 4px;
  }

  .logo {
    font-size: 12px;
    margin: 12px 2px 22px;
  }

  .logo span {
    display: none;
  }

  .nav {
    font-size: 0;
    text-align: center;
    padding: 13px 0;
  }

  .nav .emoji {
    font-size: 23px;
  }

  .content {
    padding: 15px;
  }

  .featureinfo {
    padding: 30px 20px;
  }

  .featureinfo h2 {
    font-size: 33px;
  }
}
</style>
</head>

<body>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {

import {

}
from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

// FIREBASE CONFIG

const firebaseConfig = {
  apiKey: "AIzaSyAuux4SVi5PPQUL7A0AypYoWg37rGYu0ek",
  authDomain: "gamehub-53ffd.firebaseapp.com",
  projectId: "gamehub-53ffd",
  storageBucket: "gamehub-53ffd.firebasestorage.app",
  messagingSenderId: "151536898929",
  appId: "1:151536898929:web:10b054c2d955bc2f9c9cd0",
  measurementId: "G-FFQC75X66X"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// GAMES — EXISTING ARTWORK AND LINKS

const games = [
  {

  {

    banner: "Neon Card Chaos Arena.png",
    detail: "Neon Card Chaos Arena (1).png",
    description:
      "Unlock cards and build chaotic upgrade combinations.",
    url:
      "https://himynameishitler.github.io/card-chaos/"
  }
];

// AVATAR GALLERY

const avatars = [
  {id:"classic",emoji:"🎮"},
  {id:"cat",emoji:"🐈"},
  {id:"robot",emoji:"🤖"},
  {id:"star",emoji:"⭐"},
  {id:"rocket",emoji:"🚀"},
  {id:"fox",emoji:"🦊"},
  {id:"ghost",emoji:"👻"},
  {id:"dragon",emoji:"🐉"},
  {id:"alien",emoji:"👽"},
  {id:"crown",emoji:"👑"},
  {id:"panda",emoji:"🐼"},
  {id:"flame",emoji:"🔥"}
];

// PROFILE COLOURS

const profileColors = [
  "#17263e",
  "#244b86",
  "#6336a5",
  "#ae3467",
  "#b33b3b",
  "#bb692d",
  "#247e69",
  "#23748b",
  "#494d60",
  "#121212"
];

// INVENTORY SKINS

const skins = [
  {id:"classic",name:"Classic",emoji:"🎮",free:true},
  {id:"blue",name:"Blue Flame",emoji:"🔥",free:true},
  {id:"star",name:"Star Player",emoji:"⭐",free:true},
  {id:"robot",name:"Robot",emoji:"🤖",free:true},
  {id:"cat",name:"Cat",emoji:"🐈",free:true},
  {id:"galaxy",name:"Galaxy",emoji:"🌌",free:false},
  {id:"royal",name:"Royal Crown",emoji:"👑",free:false},
  {id:"diamond",name:"Diamond",emoji:"💎",free:false},
  {id:"developer",name:"Developer",emoji:"🛠️",free:false}
];

const $ = id => document.getElementById(id);
const content = $("content");

let currentUser = null;
let profile = null;
let isAdmin = false;
let page = "discover";
let selectedGame = games[0];
let selectedPlayer = null;
let authMode = "login";

// HELPERS

function el(tag, cls = "", value = "") {
  const element = document.createElement(tag);
  element.className = cls;
  element.textContent = value;
  return element;
}

function txt(parent, tag, value, cls = "") {
  const element = el(tag, cls, value);
  parent.append(element);
  return element;
}

function button(label, action, cls = "btn") {
  const element = el("button", cls, label);
  element.onclick = action;
  return element;
}

function panel(title) {
  const element = el("section", "panel");
  if (title) txt(element, "h2", title);
  content.append(element);
  return element;
}

function input(placeholder, value = "") {
  const element = el("input", "field");
  element.placeholder = placeholder;
  element.value = value;
  return element;
}

function say(message) {
  const old = $("globalStatus");
  if (old) old.remove();

  const element = el("div", "status", message);
  element.id = "globalStatus";
  content.prepend(element);
}

function error(e) {
  console.error(e);
  return e?.message || "Something went wrong.";
}

function validName(name) {
  return /^[A-Za-z0-9_]{3,20}$/.test(name);
}

function validImageURL(value) {
  if (value.length > 500) return false;

  try {
    const url = new URL(value);
    return url.protocol === "https:" &&
      !url.username &&
      !url.password;
  } catch {
    return false;
  }
}

function art(parent, path, emoji) {
  if (!path) {
    parent.textContent = emoji;
    return;
  }

  const img = new Image();
  img.alt = "Game artwork";
  img.src = encodeURI(path);

  img.onerror = () => {
    img.remove();
    parent.textContent = emoji;
  };

  parent.append(img);
}

function avatarElement(player, big = false) {
  const cls = "avatar" + (big ? " big" : "");
  const selected = player?.avatar || "classic";

  if (validImageURL(selected)) {
    const img = new Image();
    img.className = cls;
    img.alt = "Player avatar";
    img.referrerPolicy = "no-referrer";
    img.src = selected;

    img.onerror = () => {
      const fallback = el("div", cls, "🎮");
      img.replaceWith(fallback);
    };

    return img;
  }

  const avatar = avatars.find(a => a.id === selected);
  return el("div", cls, avatar?.emoji || "🎮");
}

function playerRow(parent, player, actions = []) {
  const row = el("div", "userrow");
  const left = el("div", "row");

  left.append(avatarElement(player));

  const info = el("div");

  txt(info, "strong", player.username || "Unknown");
  txt(info, "div", player.bio || "", "muted small");

  left.append(info);
  row.append(left);

  const right = el("div", "row");

  actions.forEach(action => {
    right.append(
      button(
        action.label,
        action.action,
        "btn secondary"
      )
    );
  });

  row.append(right);
  parent.append(row);
}

function openAuth() {
  $("authOverlay").hidden = false;
  $("authError").textContent = "";
}

function requireAccount() {
  if (!currentUser) {
    openAuth();
    return false;
  }

  if (!profile) {
    go("setup");
    return false;
  }

  return true;
}

function go(next) {
  page = currentUser && !profile &&
    !["discover", "detail", "news"].includes(next)
    ? "setup"
    : next;

  render();
  window.scrollTo(0, 0);
}

function render() {
  content.replaceChildren();

  document.querySelectorAll(".nav").forEach(nav => {
    nav.classList.toggle(
      "active",
      nav.dataset.page === page
    );
  });

  if (page === "discover") discover();
  else if (page === "detail") detail();
  else if (page === "setup") setup();
  else if (page === "profile") profilePage();
  else if (page === "publicProfile") publicProfilePage();
  else if (page === "friends") friendsPage();
  else if (page === "inventory") inventoryPage();
  else if (page === "news") newsPage();
  else if (page === "admin") adminPage();
}

document.querySelectorAll(".nav").forEach(nav => {
  nav.onclick = () => go(nav.dataset.page);
});

// AUTH

function setAuthMode(mode) {
  authMode = mode;

  $("username").hidden = mode !== "register";

  $("authSubmit").textContent =
    mode === "register" ? "Create Account" : "Sign In";

  $("loginTab").className =
    "btn" + (mode === "login" ? "" : " secondary");

  $("registerTab").className =
    "btn" + (mode === "register" ? "" : " secondary");

  $("authError").textContent = "";
}

$("loginTab").onclick = () => setAuthMode("login");
$("registerTab").onclick = () => setAuthMode("register");
$("authButton").onclick = openAuth;

$("closeAuth").onclick = () => {
  $("authOverlay").hidden = true;
};

$("logoutButton").onclick = async () => {
  await signOut(auth);
};

$("authSubmit").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  const username = $("username").value.trim();

  if (authMode === "register" && !validName(username)) {
    $("authError").textContent =
      "Username must contain 3–20 letters, numbers or underscores.";
    return;
  }

  $("authSubmit").disabled = true;
  $("authError").textContent = "Please wait...";

  try {
    if (authMode === "login") {
      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );
    } else {
      const result = await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );

      await createProfile(result.user.uid, username);
    }

    $("authOverlay").hidden = true;
    $("password").value = "";

    await refreshUser();
  } catch (e) {
    $("authError").textContent = error(e);
  } finally {
    $("authSubmit").disabled = false;
  }
};

// FIRESTORE USERS

async function createProfile(uid, name) {
  const usernameRef = doc(
    db,
    "usernames",
    name.toLowerCase()
  );

  const userRef = doc(db, "users", uid);

  await runTransaction(db, async transaction => {
    const reserved = await transaction.get(usernameRef);
    const existing = await transaction.get(userRef);

    if (reserved.exists()) {
      throw Error("Username already taken.");
    }

    if (existing.exists()) {
      throw Error("Profile already exists.");
    }

    transaction.set(usernameRef, {
      uid,
      username: name
    });

    transaction.set(userRef, {
      username: name,
      usernameLower: name.toLowerCase(),
      bio: "New to Game Hub!",
      avatar: "classic",
      background: "#17263e",
      equipped: "classic",
      createdAt: serverTimestamp()
    });
  });
}

async function getPlayer(uid) {
  const snap = await getDoc(doc(db, "users", uid));

  return snap.exists()
    ? {id: snap.id, ...snap.data()}
    : null;
}

async function findPlayer(name) {
  const snap = await getDoc(
    doc(db, "usernames", name.toLowerCase())
  );

  if (!snap.exists()) return null;

  return getPlayer(snap.data().uid);
}

async function refreshUser() {
  currentUser = auth.currentUser;
  profile = null;
  isAdmin = false;

  if (currentUser) {
    const token = await currentUser.getIdTokenResult(true);

    isAdmin = token.claims.admin === true;
    profile = await getPlayer(currentUser.uid);

    if (!profile) {
      page = "setup";
    }
  } else {
    page = "discover";
  }

  $("headerName").textContent =
    profile?.username ||
    (currentUser ? "Setup needed" : "Guest");

  $("authButton").hidden = !!currentUser;
  $("logoutButton").hidden = !currentUser;
  $("adminNav").hidden = !isAdmin;

  render();
}

onAuthStateChanged(auth, () => {
  refreshUser().catch(e => say(error(e)));
});

// DISCOVER

function gameCard(game) {
  const card = el("article", "card");
  const image = el("div", "art");

  art(image, game.image, game.icon);

function discover() {
  txt(content, "h1", "Discover Games");

  txt(
    content,
    "p",

    "muted"
  );

  const featured = games[0];

  const banner = new Image();
  banner.src = encodeURI(featured.banner);
  banner.alt = featured.name;

  feature.append(banner, el("div", "shade"));

  const info = el("div", "featureinfo");

  txt(info, "span", "FEATURED GAME", "tag");

    button("View Game", () => {

      go("detail");

  );

  content.append(feature);

  const search = input("🔎 Search games...");
  content.append(search);

  const heading = txt(content, "h2", "All Games");
  const grid = el("div", "grid");

  content.append(grid);

    grid.replaceChildren();

    const found = games.filter(game =>
      (game.name + " " + game.genre)
        .toLowerCase()
        .includes(search.value.toLowerCase())

async function sendFriendRequest(player) {
  if (player.id === currentUser.uid) {
    say("You can't add yourself.");
    return;
  }

  try {
    const uid = currentUser.uid;

    const forward = doc(
      db,
      "friendRequests",
      uid + "_" + player.id
    );

    const reverse = doc(
      db,
      "friendRequests",
      player.id + "_" + uid
    );

    const [a, b] = await Promise.all([
      getDoc(forward),
      getDoc(reverse)
    ]);

    if (a.exists() || b.exists()) {
      say("A friend request or friendship already exists.");
      return;
    }

    await setDoc(forward, {
      sender: uid,
      receiver: player.id,
      status: "pending",
      createdAt: serverTimestamp()
    });

    say("Friend request sent!");
    loadFriends();
  } catch (e) {
    say(error(e));
  }
}

async function friendAction(id, accept) {
  try {
    const ref = doc(db, "friendRequests", id);

    if (accept) {
      await updateDoc(ref, {
        status: "accepted"
      });
    } else {
      await deleteDoc(ref);
    }

    loadFriends();
  } catch (e) {
    say(error(e));
  }
}

async function loadFriends() {
  if (!currentUser) return;

  const incoming = $("incoming");
  const outgoing = $("outgoing");
  const accepted = $("accepted");

  if (!incoming || !outgoing || !accepted) return;

  const boxes = [incoming, outgoing, accepted];

  for (const box of boxes) {
    while (box.children.length > 1) {
      box.lastChild.remove();
    }

    txt(box, "p", "Loading...", "muted");
  }

  try {
    const uid = currentUser.uid;

    const [sent, received] = await Promise.all([
      getDocs(
        query(
          collection(db, "friendRequests"),
          where("sender", "==", uid)
        )
      ),
      getDocs(
        query(
          collection(db, "friendRequests"),
          where("receiver", "==", uid)
        )
      )
    ]);

    if (!$("incoming")) return;

    for (const box of boxes) {
      while (box.children.length > 1) {
        box.lastChild.remove();
      }
    }

    const all = new Map();

    [...sent.docs, ...received.docs].forEach(d => {
      all.set(d.id, {
        id: d.id,
        ...d.data()
      });
    });

    for (const request of all.values()) {
      const otherId =
        request.sender === uid
          ? request.receiver
          : request.sender;

      const player = await getPlayer(otherId);

      if (!player) continue;

      if (request.status === "accepted") {
        playerRow(accepted, player, [
          {
            label: "View Profile",
            action: () => showPlayer(player)
          },
          {
            label: "Remove Friend",
            action: () => friendAction(request.id, false)
          }
        ]);
      } else if (request.receiver === uid) {
        playerRow(incoming, player, [
          {
            label: "View Profile",
            action: () => showPlayer(player)
          },
          {
            label: "Accept",
            action: () => friendAction(request.id, true)
          },
          {
            label: "Decline",
            action: () => friendAction(request.id, false)
          }
        ]);
      } else {
        playerRow(outgoing, player, [
          {
            label: "Cancel",
            action: () => friendAction(request.id, false)
          }
        ]);
      }
    }
  } catch (e) {
    say("Friends: " + error(e));
  }
}

// INVENTORY

function inventoryPage() {
  txt(content, "h1", "My Inventory");

  if (!requireAccount()) return;

  txt(
    content,
    "p",
    "Claim free cosmetics or equip exclusive admin-granted skins.",
    "muted"
  );

  const grid = el("div", "grid");
  grid.id = "skinGrid";

  content.append(grid);

  loadInventory();
}

async function loadInventory() {
  const grid = $("skinGrid");

  if (!grid || !currentUser) return;

  grid.replaceChildren();

  try {
    const snap = await getDocs(
      collection(
        db,
        "users",
        currentUser.uid,
        "inventory"
      )
    );

    const owned = new Set(
      snap.docs.map(d => d.id)
    );

    for (const skin of skins) {
      const has =
        skin.id === "classic" ||
        owned.has(skin.id);

      const card = el(
        "div",
        "skin" +
        (profile.equipped === skin.id ? " selected" : "")
      );

      card.append(
        el("div", "skinart", skin.emoji)
      );

      txt(card, "h3", skin.name);

      txt(
        card,
        "p",
        skin.free ? "Free" : "Admin Exclusive",
        "muted small"
      );

      if (profile.equipped === skin.id) {
        const b = button(
          "Equipped",
          () => {},
          "btn secondary"
        );

        b.disabled = true;
        card.append(b);
      } else if (has) {
        card.append(
          button("Equip", () => equipSkin(skin.id))
        );
      } else if (skin.free) {
        card.append(
          button("Claim Free", () => claimSkin(skin.id))
        );
      } else {
        const b = button(
          "Locked",
          () => {},
          "btn secondary"
        );

        b.disabled = true;
        card.append(b);
      }

      grid.append(card);
    }
  } catch (e) {
    say(error(e));
  }
}

async function claimSkin(id) {
  try {
    await setDoc(
      doc(
        db,
        "users",
        currentUser.uid,
        "inventory",
        id
      ),
      {
        skinId: id,
        source: "free"
      }
    );

    loadInventory();
  } catch (e) {
    say(error(e));
  }
}

async function equipSkin(id) {
  try {
    await updateDoc(
      doc(db, "users", currentUser.uid),
      {
        equipped: id
      }
    );

    profile = await getPlayer(currentUser.uid);
    loadInventory();
  } catch (e) {
    say(error(e));
  }
}
