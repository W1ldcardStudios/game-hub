
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameHub | Play Free Games</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #10121a;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 75px;
    background: #191c28;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 27px;
    font-weight: 900;
    color: #8c70ff;
}

.search {
    width: 35%;
    padding: 12px 18px;
    border-radius: 12px;
    border: 1px solid #35394a;
    background: #252938;
    color: white;
    outline: none;
    font-size: 15px;
}

.search:focus {
    border-color: #8c70ff;
}

.hero {
    margin: 30px 5%;
    padding: 45px;
    border-radius: 20px;
    background: linear-gradient(120deg, #5435c5, #a348b7, #e66b83);
}

.hero h1 {
    font-size: 38px;
    margin-bottom: 12px;
}

.hero p {
    color: #eee;
    margin-bottom: 20px;
}

.hero button {
    padding: 13px 25px;
    background: white;
    color: #33216e;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
}

.categories {
    display: flex;
    gap: 10px;
    padding: 0 5%;
    overflow-x: auto;
    margin-bottom: 30px;
}

.category {
    background: #252938;
    border: 1px solid #363b50;
    color: white;
    padding: 11px 20px;
    border-radius: 20px;
    cursor: pointer;
    white-space: nowrap;
}

.category.active,
.category:hover {
    background: #7959e9;
}

.section {
    padding: 0 5%;
    margin-bottom: 40px;
}

.section h2 {
    margin-bottom: 20px;
    font-size: 23px;
}

.games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 20px;
}

.game {
    background: #1d2130;
    border-radius: 15px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid #292e40;
}

.game:hover {
    transform: translateY(-6px);
    border-color: #8c70ff;
}

.thumbnail {
    height: 125px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 55px;
}

.game-info {
    padding: 13px;
}

.game-info h3 {
    font-size: 15px;
    margin-bottom: 6px;
}

.game-info p {
    font-size: 12px;
    color: #9299ae;
}

.tag {
    display: inline-block;
    background: #34304d;
    color: #bcaaff;
    padding: 4px 8px;
    border-radius: 5px;
    font-size: 10px;
    margin-top: 8px;
}

footer {
    text-align: center;
    padding: 35px;
    color: #737b91;
    background: #191c28;
}

.empty {
    color: #888;
    padding: 25px 0;
    display: none;
}

@media(max-width: 650px) {
    header {
        flex-wrap: wrap;
        height: auto;
        padding: 15px 5%;
        gap: 12px;
    }

    .search {
        width: 100%;
    }

    .hero {
        padding: 30px;
    }

    .hero h1 {
        font-size: 29px;
    }

    .games {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">🎮 GameHub</div>
    <input class="search" id="search"
        placeholder="Search thousands of games...">
</header>

<div class="hero">
    <h1>Find your next favourite game.</h1>
    <p>Discover games, explore new worlds and play whenever you want.</p>
    <button onclick="document.getElementById('library').scrollIntoView({behavior:'smooth'})">
        Explore Games →
    </button>
</div>

<nav class="categories" id="categories">
    <button class="category active" data-cat="All">🔥 All Games</button>
    <button class="category" data-cat="Action">⚔️ Action</button>
    <button class="category" data-cat="Racing">🏎️ Racing</button>
    <button class="category" data-cat="Sports">⚽ Sports</button>
    <button class="category" data-cat="Puzzle">🧩 Puzzle</button>
    <button class="category" data-cat="Strategy">🧠 Strategy</button>
    <button class="category" data-cat="Multiplayer">👥 Multiplayer</button>
</nav>

<section class="section" id="library">
    <h2>⭐ Popular Games</h2>
    <div class="games" id="games"></div>
    <p class="empty" id="empty">No games found. Try another search!</p>
</section>

<section class="section">
    <h2>🕹️ Recently Played</h2>
    <div class="games" id="recent"></div>
</section>

<footer>
    <h3>🎮 GameHub</h3>
    <p style="margin-top:10px">Your games. Your world.</p>
    <p style="margin-top:15px">Game links belong to their respective creators.</p>
</footer>

let selectedCategory = "All";

function renderGames() {
    const search = document.getElementById("search").value.toLowerCase();

    const filtered = games.filter(game => {
        return (
            (selectedCategory === "All" ||
             game.category === selectedCategory) &&
            game.name.toLowerCase().includes(search)
        );
    });

    const container = document.getElementById("games");

    container.innerHTML = filtered.map(game => `
        <div class="game" onclick="playGame('${game.name.replace(/'/g, "\\'")}')">
            <div class="thumbnail"
                 style="background:${game.color}">
                ${game.emoji}
            </div>
            <div class="game-info">
                <h3>${game.name}</h3>
                <p>${game.category}</p>
                <span class="tag">PLAY NOW</span>
            </div>
        </div>
    `).join("");

    document.getElementById("empty").style.display =
        filtered.length ? "none" : "block";
}

function playGame(name) {
    const game = games.find(g => g.name === name);

    if (!game) return;

    let recent = JSON.parse(
        localStorage.getItem("recentGames") || "[]"
    );

    recent = [name, ...recent.filter(n => n !== name)].slice(0, 6);

    localStorage.setItem("recentGames", JSON.stringify(recent));

    window.open(game.url, "_blank", "noopener,noreferrer");

    renderRecent();
}

function renderRecent() {
    const recent = JSON.parse(
        localStorage.getItem("recentGames") || "[]"
    );

    document.getElementById("recent").innerHTML =
        recent.map(name => {
            const game = games.find(g => g.name === name);
            if (!game) return "";

            return `
            <div class="game" onclick="playGame('${game.name.replace(/'/g, "\\'")}')">
                <div class="thumbnail" style="background:${game.color}">
                    ${game.emoji}
                </div>
                <div class="game-info">
                    <h3>${game.name}</h3>
                    <p>${game.category}</p>
                </div>
            </div>`;
        }).join("");
}

document.getElementById("search").addEventListener(
    "input", renderGames
);

document.querySelectorAll(".category").forEach(button => {
    button.addEventListener("click", () => {
        document.querySelectorAll(".category").forEach(b =>
            b.classList.remove("active")
        );

        button.classList.add("active");
        selectedCategory = button.dataset.cat;

        renderGames();
    });
});

renderGames();
renderRecent();

</script>
