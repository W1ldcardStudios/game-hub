
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Hub v4.0</title>
<style>
:root{
  color-scheme:dark;
  --bg:#080d18;--nav:#101a2b;--panel:#152238;
  --line:#30425e;--text:#f5f8ff;--muted:#a5b7d0;
  --accent:#569dff;--green:#58dfaa;--gold:#ffd479;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
.layout{display:flex;min-height:100vh}
.sidebar{width:215px;flex-shrink:0;background:var(--nav);border-right:1px solid var(--line);padding:18px 12px}
.logo{font-size:25px;font-weight:900;margin:12px 10px 30px}
.logo span{color:var(--accent)}
.nav{display:block;width:100%;background:transparent;border:0;border-radius:10px;padding:13px;margin:5px 0;color:var(--muted);text-align:left}
.nav:hover,.nav.active{background:#263d5e;color:white}
.main{flex:1;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;padding:17px 25px;background:var(--nav);border-bottom:1px solid var(--line)}
.content{padding:26px;max-width:1450px;margin:auto}
h1{margin:0 0 12px;font-size:32px}
h2{margin:0 0 14px}
h3{margin:0 0 8px}
p{line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;background:#347edb;color:white;border:0;border-radius:9px;padding:11px 17px;font-weight:700;margin:3px}
.btn:hover:not(:disabled){background:#579af0}
.btn.secondary{background:#2a405d}
.btn.danger{background:#a53c50}
.field{display:block;width:100%;background:#0b1729;color:white;border:1px solid #425a7b;border-radius:9px;padding:12px;margin:10px 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:22px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;transition:.2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.art{height:175px;background:linear-gradient(135deg,#334d74,#16253c);display:grid;place-items:center;font-size:70px;overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover}
.cardbody{padding:16px}
.feature{position:relative;min-height:350px;background:#263b59;border-radius:18px;overflow:hidden;margin:22px 0}
.feature>img{position:absolute;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#080d18f5,#080d18bd,#080d1820)}
.featureinfo{position:relative;padding:48px 35px;max-width:570px;z-index:1}
.featureinfo h2{font-size:45px}
.hero-controls{position:absolute;right:18px;bottom:18px;z-index:3;display:flex;gap:8px}
.hero-controls button{width:42px;height:42px;border:1px solid #ffffff55;border-radius:50%;background:#101a2bde;color:white;font-size:20px}
.hero-controls button:hover{background:#347edb}
.tag{display:inline-block;background:#284a76;border-radius:30px;padding:5px 11px;font-size:12px;font-weight:800}
.hero{height:350px;background:#253b5b;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:100px;margin:20px 0}
.hero img{width:100%;height:100%;object-fit:cover}
.userrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.avatar{height:50px;width:50px;flex-shrink:0;border-radius:50%;background:#304c70;display:grid;place-items:center;font-size:26px}
.avatar.big{height:105px;width:105px;font-size:55px}
.profile-banner{padding:30px;border-radius:16px;margin-bottom:20px;border:1px solid #ffffff30}
.avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:12px;margin:18px 0}
.avatar-choice{font-size:36px;padding:12px;border:2px solid transparent;background:#263d5e;border-radius:12px}
.avatar-choice:hover{border-color:var(--accent)}
.color-grid{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}
.color-choice{width:48px;height:48px;border:3px solid #ffffff55;border-radius:12px}
.skin{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px}
.skin.selected{border-color:var(--green)}
.skinart{height:100px;background:#243954;border-radius:10px;display:grid;place-items:center;font-size:60px;margin-bottom:12px}
.notice{background:#233a56;border-radius:10px;padding:15px;margin:12px 0}
.status{background:#243c58;border:1px solid #4b739d;padding:13px;border-radius:10px;margin:15px 0}
.overlay{position:fixed;inset:0;background:#000c;z-index:20;display:grid;place-items:center;padding:16px}
.modal{background:var(--panel);border:1px solid #536d92;border-radius:16px;padding:25px;width:min(450px,100%);max-height:90vh;overflow:auto}
.tabs{display:flex;gap:10px;margin:16px 0}
.tabs button{flex:1}
.balance{display:inline-flex;align-items:center;gap:8px;padding:10px 15px;background:#263d5e;border:1px solid #4e729d;border-radius:12px;font-weight:800}
.price{color:var(--gold);font-size:19px;font-weight:900}
.shopart{min-height:130px;display:grid;place-items:center;font-size:75px;background:linear-gradient(145deg,#304b77,#101c30);border-radius:12px;margin-bottom:15px}
.shopitem{padding:20px}
.raritygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.rarity{padding:18px;border-radius:12px;text-align:center;background:#20314c;border:1px solid #405a7c}
.garagetabs{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
.preview{min-height:260px;border-radius:16px;background:radial-gradient(circle at center,#355d91,#101a2b 75%);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:25px}
.previewicon{font-size:90px}
footer{text-align:center;color:var(--muted);padding:25px}
@media(max-width:760px){
 .sidebar{width:65px;padding:10px 4px}
 .logo{font-size:12px;margin:12px 2px 22px}
 .logo span{display:none}
 .nav{font-size:0;text-align:center;padding:13px 0}
 .nav .emoji{font-size:23px}
 .content{padding:15px}
 .featureinfo{padding:30px 20px}
 .featureinfo h2{font-size:33px}
}
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="logo">GAME<span>HUB</span></div>
    <button class="nav active" data-page="discover"><span class="emoji">🏠</span> Discover</button>
    <button class="nav" data-page="shop"><span class="emoji">🛒</span> Shop</button>
    <button class="nav" data-page="garage"><span class="emoji">🔧</span> Garage</button>
    <button class="nav" data-page="friends"><span class="emoji">👥</span> Friends</button>
    <button class="nav" data-page="inventory"><span class="emoji">🎨</span> Inventory</button>
    <button class="nav" data-page="profile"><span class="emoji">👤</span> Profile</button>
    <button class="nav" data-page="news"><span class="emoji">📢</span> News</button>
    <button class="nav" data-page="admin" id="adminNav" hidden><span class="emoji">🛡️</span> Admin</button>
  </aside>

  <div class="main">
    <header class="topbar">
      <strong>🎮 Game Hub v4.0</strong>
      <div class="row">
        <span class="balance" id="balance">🪙 GP — Soon</span>
        <span id="headerName" class="muted">Guest</span>
        <button class="btn" id="authButton">Sign In</button>
        <button class="btn secondary" id="logoutButton" hidden>Sign Out</button>
      </div>
    </header>
    <main class="content" id="content"></main>
    <footer>Game Hub v4.0 · Play · Connect · Customise</footer>
  </div>
</div>

<div class="overlay" id="authOverlay" hidden>
  <div class="modal">
    <h2>Welcome to Game Hub</h2>
    <p class="muted">Your games, friends and profile in one place.</p>
    <div class="tabs">
      <button class="btn" id="loginTab">Sign In</button>
      <button class="btn secondary" id="registerTab">Create Account</button>
    </div>
    <input class="field" id="email" type="email" placeholder="Email address">
    <input class="field" id="password" type="password" placeholder="Password">
    <p id="authError" style="color:#ff9aa9"></p>
    <div class="row">
      <button class="btn" id="submitAuth">Sign In</button>
      <button class="btn secondary" id="closeAuth">Cancel</button>
    </div>
  </div>
</div>

<script type="module">

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

// ====================================================

const games=[

  {id:"boost",name:"Boostball Car Drop",icon:"🏎️",count:1,description:"One car cosmetic.",ready:true},

  {id:"bat",name:"Doodle Sluggers Bat Crate",icon:"🏏",count:1,description:"One baseball bat cosmetic.",ready:false},

  {name:"Rare",color:"#569dff",refund:10},

  {name:"Mythic",color:"#ff8fba",refund:30}
];

const garages=[
  {id:"boost",name:"Boostball Garage",icon:"🏎️",description:"Cars, paint finishes, decals, wheels, boost trails and goal explosions."},
  {id:"counter",name:"Counter Opps Armoury",icon:"🔫",description:"Weapon finishes, skins and loadouts."},
  {id:"chaos",name:"Card Chaos Collection",icon:"🃏",description:"Collected cards and character cosmetics."},
  {id:"baseball",name:"Doodle Sluggers Locker",icon:"⚾",description:"Baseball bats and characters. Coming soon!"}
];

const avatars=[
  {id:"classic",emoji:"🎮"},{id:"cat",emoji:"🐈"},
  {id:"robot",emoji:"🤖"},{id:"star",emoji:"⭐"},
  {id:"rocket",emoji:"🚀"},{id:"fox",emoji:"🦊"},
  {id:"ghost",emoji:"👻"},{id:"dragon",emoji:"🐉"},
  {id:"alien",emoji:"👽"},{id:"crown",emoji:"👑"},
  {id:"panda",emoji:"🐼"},{id:"flame",emoji:"🔥"}
];

const colors=[
  "#17263e","#244b86","#6336a5","#ae3467","#b33b3b",
  "#bb692d","#247e69","#23748b","#494d60","#121212"
];

const skins=[
  {id:"classic",name:"Classic",emoji:"🎮",free:true},
  {id:"blue",name:"Blue Flame",emoji:"🔥",free:true},
  {id:"star",name:"Star Player",emoji:"⭐",free:true},
  {id:"robot",name:"Robot",emoji:"🤖",free:true},
  {id:"cat",name:"Cat",emoji:"🐈",free:true},
  {id:"galaxy",name:"Galaxy",emoji:"🌌",free:false},
  {id:"royal",name:"Royal Crown",emoji:"👑",free:false},
  {id:"diamond",name:"Diamond",emoji:"💎",free:false},
  {id:"developer",name:"Developer",emoji:"🛠️",free:false}
];

// ====================================================
// STATE AND HELPERS
// ====================================================

const $=id=>document.getElementById(id);
const content=$("content");
let currentUser=null,profile=null,isAdmin=false;
let page="discover",selectedGame=games[0],selectedPlayer=null;
let authMode="login",featuredIndex=0,carouselTimer=null;
let selectedGarage="boost";

function el(tag,cls="",value=""){
  const e=document.createElement(tag);
  e.className=cls;
  e.textContent=value;
  return e;
}
function txt(parent,tag,value,cls=""){
  const e=el(tag,cls,value);
  parent.append(e);
  return e;
}
function button(label,fn,cls="btn"){
  const b=el("button",cls,label);
  b.type="button";
  b.onclick=fn;
  return b;
}
function panel(title){
  const p=el("section","panel");
  if(title)txt(p,"h2",title);
  content.append(p);
  return p;
}
function field(placeholder,value=""){
  const i=el("input","field");
  i.placeholder=placeholder;
  i.value=value;
  return i;
}
function status(message){
  $("globalStatus")?.remove();
  const n=el("div","status",message);
  n.id="globalStatus";
  content.prepend(n);
}
function fail(e){
  console.error(e);
  return e?.message||"Something went wrong.";
}
function validName(s){return /^[A-Za-z0-9_]{3,20}$/.test(s);}
function avatarElement(p,big=false){
  const a=avatars.find(x=>x.id===p?.avatar);
  return el("div","avatar"+(big?" big":""),a?.emoji||"🎮");
}
function artwork(parent,path,emoji){
  if(!path){parent.textContent=emoji;return;}
  const img=new Image();
  img.alt="Game artwork";
  img.src=encodeURI(path);
  img.onerror=()=>{img.remove();parent.textContent=emoji;};
  parent.append(img);
}
function playerRow(parent,p,actions=[]){
  const row=el("div","userrow");
  const left=el("div","row");
  left.append(avatarElement(p));
  const info=el("div");
  txt(info,"strong",p.username||"Unknown");
  txt(info,"div",p.bio||"","muted small");
  left.append(info);
  row.append(left);
  const right=el("div","row");
  actions.forEach(a=>right.append(button(a.label,a.action,"btn secondary")));
  row.append(right);
  parent.append(row);
}
function requireAccount(){
  if(!currentUser){openAuth();return false;}
  if(!profile){go("setup");return false;}
  return true;
}
function go(next){
  clearInterval(carouselTimer);
  carouselTimer=null;
  if(["friends","inventory","profile","garage","admin"].includes(next)&&!requireAccount()){
    if(next!=="garage")return;
    if(!currentUser)return;
  }
  if(next==="admin"&&!isAdmin){next="discover";}
  page=next;
  render();
  window.scrollTo(0,0);
}
function render(){
  content.replaceChildren();
  document.querySelectorAll(".nav").forEach(n=>{
    n.classList.toggle("active",n.dataset.page===page);
  });
  const routes={
    discover,detail,shop:shopPage,garage:garagePage,
    setup,profile:profilePage,friends:friendsPage,
    inventory:inventoryPage,news:newsPage,admin:adminPage,
    publicProfile:publicProfilePage
  };
  (routes[page]||discover)();
}
document.querySelectorAll(".nav").forEach(n=>{
  n.onclick=()=>go(n.dataset.page);
});

// ====================================================
// AUTHENTICATION
// ====================================================

function openAuth(){
  $("authOverlay").hidden=false;
  $("authError").textContent="";
}
function closeAuth(){$("authOverlay").hidden=true;}
function setAuthMode(mode){
  authMode=mode;
  $("loginTab").className=mode==="login"?"btn":"btn secondary";
  $("registerTab").className=mode==="register"?"btn":"btn secondary";
  $("submitAuth").textContent=mode==="login"?"Sign In":"Create Account";
}
$("authButton").onclick=openAuth;
$("closeAuth").onclick=closeAuth;
$("loginTab").onclick=()=>setAuthMode("login");
$("registerTab").onclick=()=>setAuthMode("register");
$("logoutButton").onclick=async()=>{
  try{await signOut(auth);go("discover");}
  catch(e){status(fail(e));}
};
$("submitAuth").onclick=async()=>{
  const email=$("email").value.trim();
  const password=$("password").value;
  const b=$("submitAuth");
  b.disabled=true;
  $("authError").textContent="";
  try{
    if(authMode==="register"){
      await createUserWithEmailAndPassword(auth,email,password);
    }else{
      await signInWithEmailAndPassword(auth,email,password);
    }
    closeAuth();
  }catch(e){
    $("authError").textContent=fail(e);
  }finally{b.disabled=false;}
};

onAuthStateChanged(auth,async user=>{
  currentUser=user;
  profile=null;
  isAdmin=false;
  if(user){
    try{
      const [snap,token]=await Promise.all([
        getDoc(doc(db,"users",user.uid)),
        user.getIdTokenResult()
      ]);
      profile=snap.exists()?{uid:user.uid,...snap.data()}:null;
      isAdmin=token.claims.admin===true;
    }catch(e){console.error(e);}
  }
  $("headerName").textContent=profile?.username||user?.email||"Guest";
  $("authButton").hidden=!!user;
  $("logoutButton").hidden=!user;
  $("adminNav").hidden=!isAdmin;
  if(user&&!profile)page="setup";
  else if(!user&&["setup","profile","friends","inventory","admin"].includes(page))
    page="discover";
  render();
});

// ====================================================
// ACCOUNT SETUP
// ====================================================

function setup(){
  txt(content,"h1","Create Your Profile");
  txt(content,"p","Choose a unique username to finish setting up Game Hub.","muted");
  const p=panel("Your Username");
  const name=field("Username (3–20 letters, numbers or underscores)");
  p.append(name);
  const save=button("Create Profile",async()=>{
    if(!currentUser)return;
    const username=name.value.trim();
    if(!validName(username)){
      status("Username must be 3–20 letters, numbers or underscores.");
      return;
    }
    save.disabled=true;
    const lower=username.toLowerCase();
    try{
      const userRef=doc(db,"users",currentUser.uid);
      const nameRef=doc(db,"usernames",lower);
      await runTransaction(db,async tx=>{
        const [u,n]=await Promise.all([tx.get(userRef),tx.get(nameRef)]);
        if(u.exists())throw Error("This account already has a profile.");
        if(n.exists())throw Error("That username is already taken.");
        tx.set(userRef,{
          username,usernameLower:lower,
          bio:"New to Game Hub!",
          avatar:"classic",background:"#17263e",
          equipped:"classic",createdAt:serverTimestamp()
        });
        tx.set(nameRef,{uid:currentUser.uid,username});
      });
      profile={
        uid:currentUser.uid,username,usernameLower:lower,
        bio:"New to Game Hub!",avatar:"classic",
        background:"#17263e",equipped:"classic"
      };
      $("headerName").textContent=username;
      go("profile");
    }catch(e){status(fail(e));}
    finally{save.disabled=false;}
  });
  p.append(save);
}

// ====================================================
// DISCOVER + FEATURED CAROUSEL
// ====================================================

function discover(){
  txt(content,"h1","Discover Games");
  txt(content,"p","Play something great. Or something completely chaotic.","muted");

  const feature=el("section","feature");
  const banner=new Image();
  banner.alt="Featured game";
  banner.onerror=()=>{banner.hidden=true;};
  const shade=el("div","shade");
  const info=el("div","featureinfo");
  const tag=txt(info,"span","FEATURED GAME","tag");
  const title=txt(info,"h2","");
  const description=txt(info,"p","");
  const view=button("View Game",()=>{
    selectedGame=games[featuredIndex];
    go("detail");
  });
  info.append(view);

  const controls=el("div","hero-controls");
  const previous=button("❮",()=>change(-1));
  const next=button("❯",()=>change(1));
  controls.append(previous,next);
  feature.append(banner,shade,info,controls);
  content.append(feature);

  function change(delta){
    featuredIndex=(featuredIndex+delta+games.length)%games.length;
    const game=games[featuredIndex];
    title.textContent=game.name;
    description.textContent=game.description;
    banner.hidden=false;
    if(game.banner||game.image){
      banner.src=encodeURI(game.banner||game.image);
    }else{
      banner.hidden=true;
    }
  }
  change(0);
  carouselTimer=setInterval(()=>{
    if(page==="discover"&&feature.isConnected)change(1);
    else{clearInterval(carouselTimer);carouselTimer=null;}
  },5000);

  txt(content,"h2","All Games");
  const search=field("Search games...");
  content.append(search);
  const grid=el("div","grid");
  content.append(grid);

  function draw(){
    grid.replaceChildren();
    const term=search.value.trim().toLowerCase();
    games.filter(g=>
      g.name.toLowerCase().includes(term)||
      g.genre.toLowerCase().includes(term)
    ).forEach(g=>{
      const card=el("article","card");
      const art=el("div","art");
      artwork(art,g.image,g.icon);
      const body=el("div","cardbody");
      txt(body,"h3",g.name);
      txt(body,"p",g.genre,"muted small");
      txt(body,"p",g.description);
      body.append(button("View Game",()=>{
        selectedGame=g;go("detail");
      }));
      card.append(art,body);
      grid.append(card);
    });
  }
  search.oninput=draw;
  draw();

  txt(content,"h2","Coming Soon");
  const soon=el("article","card");
  const soonArt=el("div","art",upcoming.icon);
  const soonBody=el("div","cardbody");
  txt(soonBody,"h3",upcoming.name);
  txt(soonBody,"p",upcoming.description,"muted");
  const disabled=button("Coming Soon",()=>{});
  disabled.disabled=true;
  soonBody.append(disabled);
  soon.append(soonArt,soonBody);
  const soonGrid=el("div","grid");
  soonGrid.append(soon);
  content.append(soonGrid);
}

function detail(){
  const g=selectedGame;
  txt(content,"h1",g.name);
  const hero=el("div","hero");

  link.href=g.url;
  link.target="_blank";
  link.rel="noopener noreferrer";
  p.append(link);
  p.append(button("Back to Discover",()=>go("discover"),"btn secondary"));
}

// ====================================================
// GARAGE AND COLLECTIONS
// ====================================================

function garagePage(){
  txt(content,"h1","🔧 Garage & Collections");
  txt(content,"p","One place for all your game's cosmetics.","muted");
  const tabs=el("div","garagetabs");
  const display=el("div");
  for(const g of garages){
    const b=button(`${g.icon} ${g.name.split(" ")[0]}`,()=>{
      selectedGarage=g.id;
      show();
    },"btn secondary");
    b.dataset.id=g.id;
    tabs.append(b);
  }
  content.append(tabs,display);
  function show(){
    tabs.querySelectorAll("button").forEach(b=>{
      b.className=b.dataset.id===selectedGarage?"btn":"btn secondary";
    });
    display.replaceChildren();
    const g=garages.find(x=>x.id===selectedGarage);
    const preview=el("div","preview");
    txt(preview,"div",g.icon,"previewicon");
    txt(preview,"h2",g.name);
    txt(preview,"p",g.description,"muted");
    display.append(preview);
    const note=el("div","panel");
    txt(note,"h2","Loadout Management");
    txt(note,"p",g.id==="baseball"
      ?"Doodle Sluggers is coming soon."
      :"Cosmetic equipment slots and live previews are being prepared.");
    if(g.id!=="baseball")
      note.append(button("Browse Shop",()=>go("shop")));
    display.append(note);
  }
  show();
}

// ====================================================
// PROFILE
// ====================================================

async function saveProfile(changes){
  if(!currentUser||!profile)return;
  await updateDoc(doc(db,"users",currentUser.uid),changes);
  Object.assign(profile,changes);
}

function profilePage(){
  if(!requireAccount())return;
  txt(content,"h1","Your Profile");
  const banner=el("div","profile-banner");
  banner.style.background=profile.background||"#17263e";
  banner.append(avatarElement(profile,true));
  txt(banner,"h2",profile.username);
  txt(banner,"p",profile.bio||"");
  content.append(banner);

  const bioPanel=panel("Edit Bio");
  const bio=el("textarea","field");
  bio.value=profile.bio||"";
  bio.maxLength=500;
  bio.rows=4;
  bioPanel.append(bio);
  bioPanel.append(button("Save Bio",async()=>{
    try{
      await saveProfile({bio:bio.value});
      status("Bio saved!");
    }catch(e){status(fail(e));}
  }));

  const avatarPanel=panel("Choose Avatar");
  const ag=el("div","avatar-grid");
  for(const a of avatars){
    const b=button(a.emoji,async()=>{
      try{
        await saveProfile({avatar:a.id});
        go("profile");
      }catch(e){status(fail(e));}
    },"avatar-choice");
    b.title=a.id;
    ag.append(b);
  }
  avatarPanel.append(ag);

  const colorPanel=panel("Profile Background");
  const cg=el("div","color-grid");
  for(const c of colors){
    const b=button("",async()=>{
      try{
        await saveProfile({background:c});
        go("profile");
      }catch(e){status(fail(e));}
    },"color-choice");
    b.style.background=c;
    b.title=c;
    cg.append(b);
  }
  colorPanel.append(cg);
  const picker=el("input");
  picker.type="color";
  picker.value=/^#[0-9a-f]{6}$/i.test(profile.background||"")
    ?profile.background:"#17263e";
  colorPanel.append(picker);
  colorPanel.append(button("Save Custom Colour",async()=>{
    try{
      await saveProfile({background:picker.value});
      go("profile");
    }catch(e){status(fail(e));}
  }));
}

// ====================================================
// FRIENDS
// ====================================================

async function friendsPage(){
  if(!requireAccount())return;
  txt(content,"h1","👥 Friends");
  const searchPanel=panel("Find a Player");
  const name=field("Exact username");
  searchPanel.append(name);
  searchPanel.append(button("Search",async()=>{
    const n=name.value.trim().toLowerCase();
    if(!validName(n)){status("Enter a valid username.");return;}
    try{
      const reservation=await getDoc(doc(db,"usernames",n));
      if(!reservation.exists()){status("Player not found.");return;}
      const uid=reservation.data().uid;
      const user=await getDoc(doc(db,"users",uid));
      if(!user.exists()){status("Player profile not found.");return;}
      const found={uid,...user.data()};
      selectedPlayer=found;
      searchPanel.querySelector(".userrow")?.remove();
      playerRow(searchPanel,found,[
        {label:"View Profile",action:()=>go("publicProfile")},
        {label:"Add Friend",action:async()=>{
          if(uid===currentUser.uid){status("That's your account.");return;}
          try{
            await setDoc(doc(db,"friendRequests",`${currentUser.uid}_${uid}`),{
              sender:currentUser.uid,
              receiver:uid,
              status:"pending",
              createdAt:serverTimestamp()
            });
            status("Friend request sent!");
          }catch(e){status(fail(e));}
        }}
      ]);
    }catch(e){status(fail(e));}
  }));

  const incoming=panel("Incoming Requests");
  const outgoing=panel("Sent Requests");
  const friends=panel("Accepted Friends");
  txt(incoming,"p","Loading...","muted");

  try{
    const uid=currentUser.uid;
    const [received,sent]=await Promise.all([
      getDocs(query(collection(db,"friendRequests"),where("receiver","==",uid))),
      getDocs(query(collection(db,"friendRequests"),where("sender","==",uid)))
    ]);
    if(page!=="friends")return;
    incoming.querySelector("p")?.remove();

    const all=new Map();
    for(const d of [...received.docs,...sent.docs])all.set(d.id,{id:d.id,...d.data()});
    let incomingCount=0,outgoingCount=0,friendCount=0;

    async function getPlayer(otherUid){
      const s=await getDoc(doc(db,"users",otherUid));
      return s.exists()?{uid:otherUid,...s.data()}:{uid:otherUid,username:"Unknown"};
    }

    for(const req of all.values()){
      const otherUid=req.sender===uid?req.receiver:req.sender;
      const player=await getPlayer(otherUid);
      if(page!=="friends")return;
      if(req.status==="accepted"){
        friendCount++;
        playerRow(friends,player,[{
          label:"View",action:()=>{
            selectedPlayer=player;go("publicProfile");
          }
        }]);
      }else if(req.receiver===uid){
        incomingCount++;
        playerRow(incoming,player,[
          {label:"Accept",action:async()=>{
            try{
              await updateDoc(doc(db,"friendRequests",req.id),{status:"accepted"});
              go("friends");
            }catch(e){status(fail(e));}
          }},
          {label:"Decline",action:async()=>{
            try{
              await deleteDoc(doc(db,"friendRequests",req.id));
              go("friends");
            }catch(e){status(fail(e));}
          }}
        ]);
      }else{
        outgoingCount++;
        playerRow(outgoing,player,[{
          label:"Cancel",action:async()=>{
            try{
              await deleteDoc(doc(db,"friendRequests",req.id));
              go("friends");
            }catch(e){status(fail(e));}
          }
        }]);
      }
    }
    if(!incomingCount)txt(incoming,"p","No incoming requests.","muted");
    if(!outgoingCount)txt(outgoing,"p","No pending requests.","muted");
    if(!friendCount)txt(friends,"p","No accepted friends yet.","muted");
  }catch(e){
    status("Could not load friends: "+fail(e));
  }
}

// ====================================================
// EXISTING PROFILE SKIN INVENTORY
// ====================================================

async function inventoryPage(){
  if(!requireAccount())return;
  txt(content,"h1","🎨 Profile Inventory");
  txt(content,"p","Your existing profile skins. Game-specific cosmetics will be managed in Garage.","muted");
  const grid=el("div","grid");
  content.append(grid);

  let owned=new Set(["classic"]);
  try{
    const snap=await getDocs(collection(db,"users",currentUser.uid,"inventory"));
    snap.forEach(d=>owned.add(d.id));
  }catch(e){status(fail(e));}

  if(page!=="inventory")return;

  for(const s of skins){
    const has=owned.has(s.id);
    const card=el("article","skin"+(profile.equipped===s.id?" selected":""));
    txt(card,"div",s.emoji,"skinart");
    txt(card,"h3",s.name);
    txt(card,"p",has?"Owned":s.free?"Free to claim":"Locked","muted");
    const b=button(
      profile.equipped===s.id?"Equipped":has?"Equip":s.free?"Claim Free":"Locked",
      async()=>{
        try{
          if(!has&&s.free){
            await setDoc(doc(db,"users",currentUser.uid,"inventory",s.id),{
              skinId:s.id,source:"free"
            });
          }else if(!has)return;
          await saveProfile({equipped:s.id});
          go("inventory");
        }catch(e){status(fail(e));}
      }
    );
    b.disabled=profile.equipped===s.id||(!has&&!s.free);
    card.append(b);
    grid.append(card);
  }
}

async function newsPage(){
  txt(content,"h1","📢 News");
  const p=panel("Latest Announcements");
  txt(p,"p","Loading...","muted");
  try{
    const snap=await getDocs(query(
      collection(db,"announcements"),
      orderBy("createdAt","desc"),
      limit(30)
    ));
    if(page!=="news")return;
    p.querySelector("p")?.remove();
    if(snap.empty)txt(p,"p","No announcements yet.","muted");
    snap.forEach(d=>{
      const a=el("div","notice");
      txt(a,"h3",d.data().title||"Announcement");
      txt(a,"p",d.data().body||"");
      p.append(a);
    });
  }catch(e){status(fail(e));}
}

function adminPage(){
  if(!isAdmin){go("discover");return;}
  txt(content,"h1","🛡️ Admin Dashboard");
  const p=panel("Publish Announcement");
  const title=field("Announcement title");
  const body=el("textarea","field");
  body.placeholder="Announcement text";
  body.rows=5;
  title.maxLength=100;
  body.maxLength=1000;
  p.append(title,body);
  p.append(button("Publish",async()=>{
    const t=title.value.trim(),b=body.value.trim();
    if(!t||!b){status("Title and message are required.");return;}
    try{
      await addDoc(collection(db,"announcements"),{
        title:t,body:b,author:currentUser.uid,
        createdAt:serverTimestamp()
      });
      title.value="";body.value="";
      status("Announcement published.");
    }catch(e){status(fail(e));}
  }));
  const info=panel("Admin Security");
  txt(info,"p","Admin access is controlled by the Firebase custom claim admin: true.");
  txt(info,"p","GP grants, item grants and trade moderation will be added through the trusted backend.","muted");
}
