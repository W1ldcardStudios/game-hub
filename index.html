
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Game Hub v3.5</title>
<style>
:root{
  --bg:#080d17;--side:#101929;--panel:#152136;
  --panel2:#1e304b;--line:#32445e;--text:#f5f8ff;
  --muted:#9eb1cb;--blue:#529cff;--green:#5ce0aa
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.layout{display:flex;min-height:100vh}
.sidebar{width:215px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);padding:18px 12px}
.brand{font-size:24px;font-weight:900;margin:10px 10px 28px}
.brand span{color:var(--blue)}
.nav{width:100%;border:0;border-radius:10px;padding:13px;text-align:left;color:var(--muted);background:none;margin-bottom:5px;transition:.2s}
.nav:hover,.nav.active{background:#273d5e;color:white}
.main{flex:1;min-width:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 25px;background:var(--side);border-bottom:1px solid var(--line);flex-wrap:wrap}
.content{padding:25px;max-width:1400px;margin:auto;animation:appear .3s ease}
h1{margin:0 0 10px;font-size:32px}
h2{margin:0 0 15px}
h3{margin:0 0 8px}
p{line-height:1.5}
.muted{color:var(--muted)}
.small{font-size:13px}
.btn{background:#367fdc;color:white;border:0;border-radius:9px;padding:11px 17px;font-weight:700;transition:.2s}
.btn:hover{background:#5a9df4;transform:translateY(-2px)}
.btn.secondary{background:#2a3d58}
.btn.danger{background:#9c3449}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{width:100%;padding:12px;background:#0d192a;color:white;border:1px solid #405677;border-radius:9px;margin:7px 0}
.panel{background:var(--panel);border:1px solid var(--line);padding:22px;border-radius:15px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.25s}
.card:hover{transform:translateY(-5px);border-color:var(--blue);box-shadow:0 12px 30px #0006}
.art{height:175px;display:grid;place-items:center;font-size:70px;background:linear-gradient(135deg,#304d76,#152136);overflow:hidden}
.art img{width:100%;height:100%;object-fit:cover}
.card-body{padding:16px}
.feature{min-height:340px;border-radius:18px;position:relative;overflow:hidden;background:#253c60;margin:25px 0}
.feature img{position:absolute;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,#080d17f5,#080d17a8,#080d1710)}
.feature-info{position:relative;padding:55px 35px;max-width:590px}
.feature-info h2{font-size:44px}
.hero{height:350px;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:100px;background:#253c60}
.hero img{width:100%;height:100%;object-fit:cover}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.userrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.avatar{width:48px;height:48px;border-radius:50%;background:#2c4b75;display:grid;place-items:center;font-size:26px;flex-shrink:0}
.bigavatar{width:90px;height:90px;font-size:46px}
.skin{padding:16px;border:1px solid var(--line);background:var(--panel);border-radius:12px}
.skin-preview{height:105px;display:grid;place-items:center;font-size:60px;border-radius:10px;background:#243a58;margin-bottom:12px}
.skin.equipped{border-color:var(--green)}
.notice{padding:13px;margin:10px 0;background:#243956;border-radius:9px}
.status{padding:12px;background:#203b52;border:1px solid #477395;border-radius:9px;margin:15px 0}
.overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:30;padding:15px}
.overlay[hidden]{display:none}
.modal{background:var(--panel);border:1px solid #4b6487;border-radius:16px;padding:25px;width:min(440px,100%);max-height:90vh;overflow:auto}
footer{text-align:center;padding:30px;color:#8195b0}
@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:750px){
 .sidebar{width:65px;padding:12px 5px}
 .brand{font-size:12px;margin:12px 2px}
 .brand span{display:none}
 .nav{font-size:0;text-align:center;padding:12px 3px}
 .nav .emoji{font-size:23px}
 .content{padding:15px}
 .feature-info{padding:38px 22px}
 .feature-info h2{font-size:34px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="layout">
<aside class="sidebar">
 <div class="brand">GAME<span>HUB</span></div>
 <button class="nav active" data-page="discover"><span class="emoji">🏠</span> Discover</button>
 <button class="nav" data-page="friends"><span class="emoji">👥</span> Friends</button>
 <button class="nav" data-page="inventory"><span class="emoji">🎨</span> Inventory</button>
 <button class="nav" data-page="profile"><span class="emoji">👤</span> Profile</button>
 <button class="nav" data-page="announcements"><span class="emoji">📢</span> News</button>
 <button class="nav" data-page="admin" id="adminNav" hidden><span class="emoji">🛡️</span> Admin</button>
</aside>

<div class="main">
 <header class="topbar">
  <strong>🎮 Game Hub v3.5</strong>
  <div class="row">
   <span id="headerName" class="muted">Guest</span>
   <button class="btn" id="authButton">Sign In</button>
   <button class="btn secondary" id="logoutButton" hidden>Sign Out</button>
  </div>
 </header>

 <main class="content" id="content"></main>
 <footer>Game Hub v3.5 · Friends · Skins · Community</footer>
</div>
</div>

<div class="overlay" id="authOverlay" hidden>
 <div class="modal">
  <h2>Game Hub Account</h2>
  <p class="muted">Sign in or create your account.</p>
  <input id="email" class="field" type="email" placeholder="Email">
  <input id="password" class="field" type="password" placeholder="Password">
  <input id="username" class="field" placeholder="New username (3–20 letters, numbers or _)">
  <p class="small muted">Username is only required when creating an account.</p>
  <div class="row">
   <button class="btn" id="login">Sign In</button>
   <button class="btn secondary" id="register">Create Account</button>
   <button class="btn secondary" id="closeAuth">Close</button>
  </div>
  <p id="authError" class="muted small"></p>
 </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {
 getAuth,onAuthStateChanged,createUserWithEmailAndPassword,
 signInWithEmailAndPassword,signOut
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {
 getFirestore,doc,getDoc,getDocs,setDoc,updateDoc,
 deleteDoc,collection,query,where,limit,runTransaction,
 serverTimestamp,addDoc,orderBy
} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAuux4SVi5PPQUL7A0AypYoWg37rGYu0ek",
 authDomain:"gamehub-53ffd.firebaseapp.com",
 projectId:"gamehub-53ffd",
 storageBucket:"gamehub-53ffd.firebasestorage.app",
 messagingSenderId:"151536898929",
 appId:"1:151536898929:web:10b054c2d955bc2f9c9cd0",
 measurementId:"G-FFQC75X66X"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

// GAME LIBRARY

const games=[
 {
  id:"counter",name:"Counter Opps",icon:"🎯",
  image:"counter-opps.png",
  banner:"counter-opps-banner.png",
  detail:"counter-opps-detail.png",
  genre:"Shooter",
  description:"Tactical first-person shooting with bots, weapons and competitive rounds.",
  url:"https://himynameishitler.github.io/Counter-Opps-/"
 },
 {
  id:"boost",name:"Boostball",icon:"🚗",
  image:"",banner:"",detail:"",
  genre:"Sports",
  description:"Drive, boost, jump and score in a car-soccer arena.",
  url:"https://himynameishitler.github.io/boostball/"
 },
 {
  id:"chaos",name:"Card Chaos",icon:"🃏",
  image:"Neon Jester Card Chaos.png",
  banner:"Neon Card Chaos Arena.png",
  detail:"Neon Card Chaos Arena (1).png",
  genre:"Action",
  description:"Collect upgrade cards and create powerful combinations in chaotic battles.",
  url:"https://himynameishitler.github.io/card-chaos/"
 }
];

// COSMETIC SKINS

const skins=[
 {id:"classic",name:"Classic",emoji:"🎮",type:"free"},
 {id:"blue",name:"Blue Flame",emoji:"🔥",type:"free"},
 {id:"star",name:"Star Player",emoji:"⭐",type:"free"},
 {id:"robot",name:"Robot",emoji:"🤖",type:"free"},
 {id:"cat",name:"Cat",emoji:"🐈",type:"free"},
 {id:"galaxy",name:"Galaxy",emoji:"🌌",type:"exclusive"},
 {id:"royal",name:"Royal Crown",emoji:"👑",type:"exclusive"},
 {id:"diamond",name:"Diamond",emoji:"💎",type:"exclusive"},
 {id:"developer",name:"Developer",emoji:"🛠️",type:"exclusive"}
];

const $=id=>document.getElementById(id);
const content=$("content");

let currentUser=null;
let profile=null;
let isAdmin=false;
let page="discover";
let currentGame=null;

function node(tag,cls="",value=""){
 const n=document.createElement(tag);
 if(cls)n.className=cls;
 n.textContent=value;
 return n;
}

function btn(value,fn,cls="btn"){
 const b=node("button",cls,value);
 b.onclick=fn;
 return b;
}

function text(parent,tag,value,cls=""){
 const n=node(tag,cls,value);
 parent.appendChild(n);
 return n;
}

function panel(parent,title){
 const p=node("section","panel");
 if(title)text(p,"h2",title);
 parent.appendChild(p);
 return p;
}

function field(placeholder,value=""){
 const i=node("input","field");
 i.placeholder=placeholder;
 i.value=value;
 return i;
}

function message(parent,value){
 text(parent,"p",value,"muted");
}

function errorText(err){
 console.error(err);
 return err?.message||"Something went wrong.";
}

function setStatus(value){
 const old=$("globalStatus");
 if(old)old.remove();
 const p=node("div","status",value);
 p.id="globalStatus";
 content.prepend(p);
}

function requireLogin(){
 if(currentUser&&profile)return true;
 openAuth();
 return false;
}

function go(next){
 page=next;
 render();
 window.scrollTo(0,0);
}

function image(container,path,fallback){
 if(!path){
  container.textContent=fallback;
  return;
 }
 const img=new Image();
 img.alt="Game artwork";
 img.src=encodeURI(path);
 img.onerror=()=>{container.textContent=fallback;};
 container.appendChild(img);
}

function userAvatar(p){
 const s=skins.find(x=>x.id===p?.equipped)||skins[0];
 return s.emoji;
}

function usernameValid(s){
 return /^[a-zA-Z0-9_]{3,20}$/.test(s);
}

function requestId(sender,receiver){
 return sender+"_"+receiver;
}

async function userByName(name){
 const ref=doc(db,"usernames",name.toLowerCase());
 const snap=await getDoc(ref);
 if(!snap.exists())return null;
 const userSnap=await getDoc(doc(db,"users",snap.data().uid));
 return userSnap.exists()
  ?{id:userSnap.id,...userSnap.data()}
  :null;
}

async function getPlayer(uid){
 const snap=await getDoc(doc(db,"users",uid));
 return snap.exists()
  ?{id:snap.id,...snap.data()}
  :null;
}

function playerRow(parent,p,actions=[]){
 const r=node("div","userrow");
 const left=node("div","row");

 left.appendChild(node("div","avatar",userAvatar(p)));

 const info=node("div");
 text(info,"strong",p.username||"Unknown player");
 text(info,"div",p.bio||"","muted small");

 left.appendChild(info);
 r.appendChild(left);

 const right=node("div","row");

 actions.forEach(a=>{
  right.appendChild(
   btn(a.label,a.run,a.cls||"btn secondary")
  );
 });

 r.appendChild(right);
 parent.appendChild(r);
}

// ACCOUNT SYSTEM

function openAuth(){
 $("authOverlay").hidden=false;
 $("authError").textContent="";
}

$("authButton").onclick=openAuth;

$("closeAuth").onclick=()=>{
 $("authOverlay").hidden=true;
};

$("login").onclick=async()=>{
 $("authError").textContent="Signing in...";

 try{
  await signInWithEmailAndPassword(
   auth,
   $("email").value.trim(),
   $("password").value
  );

  $("authOverlay").hidden=true;
  $("password").value="";
 }catch(e){
  $("authError").textContent=errorText(e);
 }
};

$("register").onclick=async()=>{
 const name=$("username").value.trim();

 if(!usernameValid(name)){
  $("authError").textContent=
   "Use 3–20 letters, numbers or underscores.";
  return;
 }

 $("authError").textContent="Creating account...";

 try{
  const result=await createUserWithEmailAndPassword(
   auth,
   $("email").value.trim(),
   $("password").value
  );

  const uid=result.user.uid;

  await createProfile(uid,name);

  $("authOverlay").hidden=true;
  $("password").value="";

  await refreshUser();
 }catch(e){
  $("authError").textContent=errorText(e);
 }
};

$("logoutButton").onclick=async()=>{
 await signOut(auth);
 go("discover");
};

async function createProfile(uid,name){
 const usernameRef=doc(
  db,"usernames",name.toLowerCase()
 );
 const userRef=doc(db,"users",uid);

 await runTransaction(db,async tx=>{
  const taken=await tx.get(usernameRef);
  const existing=await tx.get(userRef);

  if(taken.exists()){
   throw Error("That username is already taken.");
  }

  if(existing.exists()){
   throw Error("Profile already exists.");
  }

  tx.set(usernameRef,{
   uid,
   username:name
  });

  tx.set(userRef,{
   username:name,
   usernameLower:name.toLowerCase(),
   bio:"New to Game Hub!",
   equipped:"classic",
   createdAt:serverTimestamp()
  });
 });
}

async function refreshUser(){
 currentUser=auth.currentUser;
 profile=null;
 isAdmin=false;

 if(currentUser){
  const token=await currentUser.getIdTokenResult(true);
  isAdmin=token.claims.admin===true;
  profile=await getPlayer(currentUser.uid);
 }

 $("headerName").textContent=
  profile?.username||
  (currentUser?"Setup needed":"Guest");

 $("authButton").hidden=!!currentUser;
 $("logoutButton").hidden=!currentUser;
 $("adminNav").hidden=!isAdmin;

 render();
}

onAuthStateChanged(auth,async user=>{
 try{
  currentUser=user;
  await refreshUser();
 }catch(e){
  console.error(e);
  setStatus("Account loading failed: "+errorText(e));
 }
});

// NAVIGATION

function render(){
 content.replaceChildren();

 document.querySelectorAll(".nav").forEach(b=>{
  b.classList.toggle(
   "active",
   b.dataset.page===page
  );
 });

 if(page==="discover")renderDiscover();
 else if(page==="detail")renderDetail();
 else if(page==="friends")renderFriends();
 else if(page==="inventory")renderInventory();
 else if(page==="profile")renderProfile();
 else if(page==="announcements")renderAnnouncements();
 else if(page==="admin")renderAdmin();
}

document.querySelectorAll(".nav").forEach(b=>{
 b.onclick=()=>go(b.dataset.page);
});

// GAME CARDS

function gameCard(g){
 const card=node("div","card");
 const art=node("div","art");

 image(art,g.image,g.icon);
 card.appendChild(art);

 const body=node("div","card-body");
 text(body,"h3",g.name);
 text(body,"p",g.genre,"muted small");

 body.appendChild(btn("View Game",()=>{
  currentGame=g;
  go("detail");
 }));

 card.appendChild(body);
 return card;
}

function renderDiscover(){
 text(content,"h1","Discover Games");
 message(content,"Find your next favourite game.");

 const featured=games[0];
 const feature=node("section","feature");

 const media=node("div");
 image(media,featured.banner,featured.icon);

 feature.appendChild(media);
 feature.appendChild(node("div","shade"));

 const info=node("div","feature-info");

 text(info,"span","FEATURED GAME","tag");
 text(info,"h2",featured.name);
 text(info,"p",featured.description);

 info.appendChild(btn("View Game",()=>{
  currentGame=featured;
  go("detail");
 }));

 feature.appendChild(info);
 content.appendChild(feature);

 text(content,"h2","Game Library");

 const grid=node("div","grid");
 games.forEach(g=>grid.appendChild(gameCard(g)));
 content.appendChild(grid);
}

function renderDetail(){
 const g=currentGame;

 if(!g){
  go("discover");
  return;
 }

 content.appendChild(
  btn("← Back",()=>go("discover"),"btn secondary")
 );

 const hero=node("div","hero");
 hero.style.marginTop="18px";

 image(hero,g.detail||g.banner||g.image,g.icon);
 content.appendChild(hero);

 const p=panel(content,g.name);

 message(p,g.description);
 text(p,"p","Genre: "+g.genre);

 const link=node("a","btn","▶ Play Game");
 link.href=g.url;
 link.target="_blank";
 link.rel="noopener noreferrer";

 p.appendChild(link);
}

// PLAYER PROFILE

function renderProfile(){
 text(content,"h1","My Profile");

 if(!requireLogin())return;

 if(!profile){
  message(
   content,
   "Your account needs a profile. If registration failed, contact the site administrator."
  );
  return;
 }

 const p=panel(content,"Player Profile");
 const r=node("div","row");

 r.appendChild(
  node("div","avatar bigavatar",userAvatar(profile))
 );

 const info=node("div");

 text(info,"h2",profile.username);
 text(info,"p",profile.bio,"muted");

 r.appendChild(info);
 p.appendChild(r);

 text(p,"h3","Edit Bio");

 const bio=field("Your bio",profile.bio);
 bio.maxLength=120;

 p.appendChild(bio);

 p.appendChild(btn("Save Bio",async()=>{
  try{
   await updateDoc(
    doc(db,"users",currentUser.uid),
    {bio:bio.value.trim().slice(0,120)}
   );

   profile=await getPlayer(currentUser.uid);
   setStatus("Profile updated!");
  }catch(e){
   setStatus(errorText(e));
  }
 }));

 message(p,"Username changes are not available yet.");

 if(isAdmin){
  text(p,"p","🛡️ Administrator","tag");
 }
}

// FRIEND REQUESTS

async function sendRequest(target){
 if(!requireLogin())return;

 if(target.id===currentUser.uid){
  setStatus("You can't friend yourself.");
  return;
 }

 const id=requestId(currentUser.uid,target.id);

 try{
  await setDoc(doc(db,"friendRequests",id),{
   sender:currentUser.uid,
   receiver:target.id,
   status:"pending",
   createdAt:serverTimestamp()
  });

  setStatus(
   "Friend request sent to "+target.username+"!"
  );
 }catch(e){
  setStatus(errorText(e));
 }
}

async function respondToRequest(id,action){
 try{
  const ref=doc(db,"friendRequests",id);

  if(action==="accept"){
   await updateDoc(ref,{status:"accepted"});
  }else{
   await deleteDoc(ref);
  }

  await loadFriends();
 }catch(e){
  setStatus(errorText(e));
 }
}

async function removeFriend(id){
 await respondToRequest(id,"remove");
}

function renderFriends(){
 text(content,"h1","Friends");

 if(!requireLogin())return;
 if(!profile)return;

 const search=panel(content,"Find Players");
 const input=field("Search exact username");

 search.appendChild(input);

 const results=node("div");

 search.appendChild(btn("Search",async()=>{
  results.replaceChildren();

  const name=input.value.trim();

  if(!usernameValid(name)){
   message(results,"Enter a valid username.");
   return;
  }

  try{
   const p=await userByName(name);

   if(!p){
    message(results,"Player not found.");
    return;
   }

   playerRow(results,p,[{
    label:"Add Friend",
    run:()=>sendRequest(p)
   }]);
  }catch(e){
   message(results,errorText(e));
  }
 }));

 search.appendChild(results);

 const incoming=panel(content,"Incoming Requests");
 incoming.id="incomingRequests";

 const outgoing=panel(content,"Sent Requests");
 outgoing.id="outgoingRequests";

 const accepted=panel(content,"Your Friends");
 accepted.id="acceptedFriends";

 loadFriends();
}

async function loadFriends(){
 if(!currentUser)return;

 const incoming=$("incomingRequests");
 const outgoing=$("outgoingRequests");
 const accepted=$("acceptedFriends");

 if(!incoming||!outgoing||!accepted)return;

 for(const box of [incoming,outgoing,accepted]){
  while(box.children.length>1){
   box.lastChild.remove();
  }
  message(box,"Loading...");
 }

 try{
  const uid=currentUser.uid;

  const [sent,received]=await Promise.all([
   getDocs(query(
    collection(db,"friendRequests"),
    where("sender","==",uid)
   )),
   getDocs(query(
    collection(db,"friendRequests"),
    where("receiver","==",uid)
   ))
  ]);

  const all=new Map();

  [...sent.docs,...received.docs].forEach(d=>{
   all.set(d.id,{
    id:d.id,
    ...d.data()
   });
  });

  for(const box of [incoming,outgoing,accepted]){
   while(box.children.length>1){
    box.lastChild.remove();
   }
  }

  const requests=[...all.values()];

  if(!requests.length){
   message(accepted,"No friends yet.");
   return;
  }

  for(const req of requests){
   const otherId=
    req.sender===uid?req.receiver:req.sender;

   const p=await getPlayer(otherId);

   if(!p)continue;

   if(req.status==="accepted"){
    playerRow(accepted,p,[{
     label:"Remove",
     run:()=>removeFriend(req.id)
    }]);
   }else if(req.receiver===uid){
    playerRow(incoming,p,[
     {
      label:"Accept",
      run:()=>respondToRequest(req.id,"accept")
     },
     {
      label:"Decline",
      run:()=>respondToRequest(req.id,"decline"),
      cls:"btn secondary"
     }
    ]);
   }else{
    playerRow(outgoing,p,[{
     label:"Cancel",
     run:()=>respondToRequest(req.id,"cancel")
    }]);
   }
  }
 }catch(e){
  setStatus(
   "Could not load friends: "+errorText(e)
  );
 }
}

// SKIN INVENTORY

async function ownedSkins(uid){
 const snap=await getDocs(
  collection(db,"users",uid,"inventory")
 );

 return new Set(
  snap.docs.map(d=>d.id)
 );
}

async function claimFreeSkin(skinId){
 if(!requireLogin())return;

 try{
  const skin=skins.find(s=>s.id===skinId);

  if(!skin||skin.type!=="free"){
   throw Error("Not a free skin.");
  }

  await setDoc(
   doc(db,"users",currentUser.uid,"inventory",skinId),
   {
    skinId,
    source:"free"
   }
  );

  await loadInventory();
 }catch(e){
  setStatus(errorText(e));
 }
}

async function equipSkin(skinId){
 if(!requireLogin())return;

 try{
  if(skinId!=="classic"){
   const owned=await getDoc(
    doc(db,"users",currentUser.uid,"inventory",skinId)
   );

   if(!owned.exists()){
    throw Error("Skin not owned.");
   }
  }

  await updateDoc(
   doc(db,"users",currentUser.uid),
   {equipped:skinId}
  );

  profile=await getPlayer(currentUser.uid);

  await loadInventory();

  $("headerName").textContent=profile.username;
 }catch(e){
  setStatus(errorText(e));
 }
}

function renderInventory(){
 text(content,"h1","Skin Inventory");

 if(!requireLogin())return;

 message(
  content,
  "Claim free cosmetics and equip exclusive skins granted by an admin."
 );

 const grid=node("div","grid");
 grid.id="skinGrid";

 content.appendChild(grid);

 loadInventory();
}

async function loadInventory(){
 const grid=$("skinGrid");

 if(!grid||!currentUser)return;

 grid.replaceChildren();

 try{
  const owned=await ownedSkins(currentUser.uid);

  for(const skin of skins){
   const has=
    skin.id==="classic"||
    owned.has(skin.id);

   const card=node(
    "div",
    "skin"+(
     profile?.equipped===skin.id?" equipped":""
    )
   );

   const preview=node(
    "div","skin-preview",skin.emoji
   );

   card.appendChild(preview);

   text(card,"h3",skin.name);

   text(
    card,"p",
    skin.type==="free"?"Free":"Admin Exclusive",
    "muted small"
   );

   if(profile?.equipped===skin.id){
    card.appendChild(
     btn("Equipped",()=>{},"btn secondary")
    );
   }else if(has){
    card.appendChild(
     btn("Equip",()=>equipSkin(skin.id))
    );
   }else if(skin.type==="free"){
    card.appendChild(
     btn("Claim Free",()=>claimFreeSkin(skin.id))
    );
   }else{
    card.appendChild(
     btn("Locked",()=>{},"btn secondary")
    );
   }

   grid.appendChild(card);
  }
 }catch(e){
  setStatus(errorText(e));
 }
}

// NEWS AND ANNOUNCEMENTS

function renderAnnouncements(){
 text(content,"h1","Game Hub News");

 const list=panel(content,"Announcements");
 list.id="newsList";

 loadAnnouncements();
}

async function loadAnnouncements(){
 const list=$("newsList");

 if(!list)return;

 try{
  const snap=await getDocs(query(
   collection(db,"announcements"),
   orderBy("createdAt","desc"),
   limit(20)
  ));

  if(snap.empty){
   message(list,"No announcements yet.");
  }

  snap.forEach(d=>{
   const p=node("div","notice");

   text(
    p,"h3",
    d.data().title||"Announcement"
   );

   text(
    p,"p",
    d.data().body||""
   );

   list.appendChild(p);
  });
 }catch(e){
  message(list,errorText(e));
 }
}

// ADMIN DASHBOARD

function renderAdmin(){
 text(content,"h1","🛡️ Admin Dashboard");

 if(!isAdmin){
  message(content,"Access denied.");
  return;
 }

 const lookup=panel(content,"Player Management");
 const search=field("Exact player username");

 lookup.appendChild(search);

 const results=node("div");

 lookup.appendChild(btn("Find Player",async()=>{
  results.replaceChildren();

  try{
   const p=await userByName(
    search.value.trim()
   );

   if(!p){
    message(results,"Player not found.");
    return;
   }

   playerRow(results,p);

   text(results,"h3","Grant Exclusive Skin");

   for(const skin of skins.filter(
    s=>s.type==="exclusive"
   )){
    results.appendChild(btn(
     skin.emoji+" "+skin.name,
     async()=>{
      try{
       await setDoc(
        doc(db,"users",p.id,"inventory",skin.id),
        {
         skinId:skin.id,
         source:"admin",
         grantedBy:currentUser.uid,
         grantedAt:serverTimestamp()
        }
       );

       setStatus(
        "Granted "+skin.name+" to "+p.username
       );
      }catch(e){
       setStatus(errorText(e));
      }
     },
     "btn secondary"
    ));
   }
  }catch(e){
   message(results,errorText(e));
  }
 }));

 lookup.appendChild(results);

 const announce=panel(
  content,"Publish Announcement"
 );

 const title=field("Announcement title");
 title.maxLength=100;

 const body=node("textarea","field");
 body.placeholder="Announcement message";
 body.rows=5;
 body.maxLength=1000;

 announce.append(title,body);

 announce.appendChild(btn("Publish",async()=>{
  if(!title.value.trim()||!body.value.trim()){
   setStatus("Title and message required.");
   return;
  }

  try{
   await addDoc(
    collection(db,"announcements"),
    {
     title:title.value.trim(),
     body:body.value.trim(),
     author:currentUser.uid,
     createdAt:serverTimestamp()
    }
   );

   title.value="";
   body.value="";

   setStatus("Announcement published!");
  }catch(e){
   setStatus(errorText(e));
  }
 }));
}

render();
</script>
</body>
</html>
